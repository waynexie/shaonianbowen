schema_version: 1
source:
  source_figma_file_key: oULxBlEvFNkWGGVaJ0ClEz
  authority: live_figma_variables_first
  binding_policy_ref: references/metadata/validation.yaml#minimum_token_binding_check
  component_policy_ref: references/metadata/validation.yaml#registered_component_family_gate_check
  text_policy_ref: references/metadata/tokens.yaml#typography.runtime_text_policy
colors:
  text:
    t1:
      figma_name: Text 文本/T1 主要
      variable_id: VariableID:180:3364
      value: '#333333'
      use_for:
      - primary titles
      - row labels
      - active bottom tab text
      - card titles
      avoid_for:
      - helper metadata
      - disabled text
      examples:
      - 'Settings row label: 少年年龄'
      - Profile list title
    t2:
      figma_name: Text 文本/T2 次要
      variable_id: VariableID:180:3365
      value: '#5C5C5C'
      use_for:
      - secondary labels
      - unselected navigation text
      - compact helper text with normal emphasis
      examples:
      - BottomBar unselected tab
    t3:
      figma_name: Text 文本/T3 辅助
      variable_id: VariableID:180:3366
      value: '#999999'
      use_for:
      - timestamp
      - source/time metadata
      - right-side setting helper text
      - low-priority profile utilities
      examples:
      - Settings 检查更新 right helper
      - NewsCard source and time
    t4_pressed_image:
      figma_name: Text 文本/T4 压图
      variable_id: VariableID:180:3367
      value: '#FFFFFF'
      use_for:
      - text on image overlays
      - selected text on dark filled pill when source pattern exists
      avoid_for:
      - normal page body
  background:
    page_gray:
      figma_name: Bg 背景/PageGray 灰底页面
      variable_id: VariableID:180:3518
      value: '#F5F5F5'
      use_for:
      - profile pages
      - settings pages
      - quiet utility screens
      examples:
      - Profile source 4232:11310 / ↳ tab3 个人中心
      - source-frames.yaml use_for=settings
    page_white:
      figma_name: Bg 背景/PageWhite 白底页面
      variable_id: VariableID:180:3519
      value: '#FFFFFF'
      use_for:
      - article/detail base
      - settings when source frame is white
    block:
      figma_name: Bg 背景/Block 内容块
      variable_id: VariableID:180:3521
      value: '#F7F7F7'
      use_for:
      - settings row fill
      - inactive pills
      - subtle grouped utility strip
      - selected BottomBar pill in source pattern
      avoid_for:
      - page background
    card:
      figma_name: Bg 背景/Card 卡片
      variable_id: VariableID:180:3523
      value: '#FFFFFF'
      use_for:
      - NewsCard content surface
      - UserCard
      - content modules on gray background
      border_default: false
    placeholder:
      figma_name: Bg 背景/Placeholder 占位
      variable_id: VariableID:215:4999
      use_for:
      - temporary media placeholders only
      avoid_for:
      - final visual design when real/source-like image is required
  brand:
    primary:
      figma_name: Brand 品牌/Primary 主色
      variable_id: VariableID:308:36
      value: '#75CE00'
      use_for:
      - brand accent
      - progress dots
      - selected state highlight
      avoid_for:
      - full page background by default
      - every card/module
    text:
      figma_name: Brand 品牌/Text 品牌文字
      variable_id: VariableID:308:37
      use_for:
      - selected tab text when source uses green
      - key brand action text
    bg_soft:
      figma_name: Brand 品牌/BgSoft 柔和背景
      variable_id: VariableID:308:39
      use_for:
      - selected profile tab background
      - subtle brand emphasis chip
      avoid_for:
      - large independent feature cards unless source uses it
  line:
    border:
      figma_name: Line 线条/Border 描边
      variable_id: VariableID:180:3665
      use_for:
      - outline buttons
      - IconButton outline
      - small controls/chips if source uses stroke
      avoid_for:
      - normal content cards
      - settings rows
      - profile modules
    divider_thin:
      figma_name: Line 线条/DividerThin 细分割线
      variable_id: VariableID:180:3667
      use_for:
      - internal separators in one grouped container
      avoid_for:
      - separating unrelated independent cards
radii:
  policy:
    source: live_figma_variables_first
    allowed_non_pill_values:
    - 8
    - 12
    - 20
    max_non_pill_radius: 20
    pill_value: 999
    raw_radius_policy: 'Non-pill rectangles must use Radius/8, Radius/12, or Radius/20 unless an existing source
      component explicitly uses another value. Values such as 24, 28, or 32 are local-radius violations for cards,
      blocks, sheets, and custom panels.

      '
  r8:
    token_name: Radius/8
    value: 8
    use_for:
    - dense tags only when source uses small tags
    avoid_for:
    - main cards
    - buttons
  r12:
    token_name: Radius/12
    value: 12
    use_for:
    - media thumbnails
    - compact image slots
    - sheet top bar details when source uses it
    avoid_for:
    - command buttons
    - major content cards
  r20:
    token_name: Radius/20
    variable_id: VariableID:306:2998
    value: 20
    use_for:
    - main cards
    - profile content blocks
    - settings rows
    - sheet top corners
    examples:
    - source-frames.yaml use_for=settings
    - NewsCard and UserCard surfaces
    figma_name: 20 大圆角
  pill:
    token_name: Radius/999
    value: 999
    use_for:
    - buttons
    - filter pills
    - chips
    - tab pills
    - icon buttons
    avoid_for:
    - large rectangular content cards
spacing:
  s4:
    value: 4
    use_for:
    - micro icon-label gaps
  s6:
    value: 6
    use_for:
    - tiny chip inner gaps
  s8:
    value: 8
    use_for:
    - title-subtitle gaps
    - compact row gaps
  s12:
    variable_id: VariableID:306:2975
    value: 12
    use_for:
    - settings row gap
    - chip group gap
    - related inline controls
    examples:
    - Settings list vertical itemSpacing
    figma_name: '12'
  s16:
    value: 16
    use_for:
    - repeated feed card gap
    - compact list item internal gap
    examples:
    - Home NewsCard list gap
  s20:
    variable_id: VariableID:306:2981
    value: 20
    use_for:
    - page horizontal padding
    - card padding
    - settings row horizontal/vertical padding
    examples:
    - 390 screen uses 20 side padding and 350 content width
    figma_name: '20'
  s24:
    value: 24
    use_for:
    - separation between large page regions
    - bottom safe spacing before fixed bars
typography:
  runtime_text_policy:
    text_engine: mcp_default
    new_or_modified_text: create_with_mcp_default
    existing_untouched_text: do_not_mutate
  title_page:
    size: 22
    line_height: 22
    use_for:
    - page title
    - major header title
  title_card:
    size: 18
    line_height: 26
    use_for:
    - feed card title
    - profile reading item title
  row_label:
    derived_from: source-frames.yaml use_for=settings
    size: 18
    line_height: 18
    color: text.t1
    use_for:
    - settings row left label
  row_helper:
    derived_from: Settings 检查更新 helper
    size: 18
    line_height: 30
    color: text.t3
    use_for:
    - settings row right helper
  secondary:
    size: 14
    line_height: 14
    color: text.t2
  caption:
    size: 12
    line_height: 12
    color: text.t3
effects:
  bottom_bar:
    style_name: BottomBar 底部栏
    type: DROP_SHADOW
    color: '#0000000A'
    offset:
    - 0
    - -4
    radius: 4
    use_for:
    - BottomBar only
  button_shadow:
    type: DROP_SHADOW
    color: '#0000000A'
    offset:
    - 0
    - 4
    radius: 4
    use_for:
    - source IconButton or Button component when already present
    - floating controls
    avoid_for:
    - normal feed cards
    - settings rows
    - profile utility modules
surfaces:
  normal_content_card:
    fill: background.card
    radius: radii.r20
    stroke: none
    shadow: none
    examples:
    - NewsCard
    - UserCard
    - profile content block
  settings_row:
    layout_usage: legacy geometry example only; new rows use the selected live components.SettingsRow variant
    fill: background.block
    radius: radii.r20
    stroke: none
    shadow: none
    layout:
      mode: HORIZONTAL
      height: 70
      gap: 10
      padding: 20
      align: SPACE_BETWEEN
    right_helper: typography.row_helper
  profile_weak_utility:
    fill: background.card_or_block
    radius: radii.r20
    stroke: none
    shadow: none
    emphasis: low
    use_for:
    - secondary functions such as 换肤 and 福利中心
