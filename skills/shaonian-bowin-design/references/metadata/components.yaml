  authority: live_figma_components_first
  rule: extend_nearest_family_before_creating_new_family
  excluded_authority_page_ids:
  - 4608:4097
  component_resolution_policy:
    primary_locator: node_id
    required_live_type_check: true
    valid_instance_sources:
    - COMPONENT
    - concrete COMPONENT child of COMPONENT_SET
    container_behavior: if node_id resolves to FRAME SECTION or catalog container, scan its local descendants
      or registered component page for the matching COMPONENT or COMPONENT_SET; never instance the container
      itself.
    rule: resolve only local nodes inside Figma file oULxBlEvFNkWGGVaJ0ClEz; no secondary locator, non-local
      fallback, or destination switch exists.
    last_verified: '2026-07-14'
    target_page_for_instance_smoke_test: 4608:4097
    failure_policy: if live type verification cannot resolve a concrete local ready_to_force component or variant,
      stop instead of switching files or drawing primitives.
component_audit_contract:
  reference: references/component-audit.md
  status_values:
    ready_to_force: must use as instance or variant; stop if unavailable
    usable_with_recipe: use with page recipe constraints; local composition allowed only where documented
    needs_componentization: source pattern is stable but not a component; follow recipe and report gap
    source_only_reference: visual or IA reference only
  default_fallback_policy:
    ready_to_force: stop
    usable_with_recipe: use_recipe_or_stop
    needs_componentization: recipe_local_layout_allowed
    source_only_reference: do_not_force_as_component
  precedence:
  - required_instance and ready_to_force requirements apply to every quality tier and context strategy
  - source_locked_visual_draft locks context while registered target-region components remain instances variants
    or documented same-family extensions
  - production_gaps scope is limited to unregistered new componentization and other production-readiness gaps
  ready_to_force:
  - HomeHeaderBar
  - NavigationBar
  - StatusBar
  - SectionTitle
  - TabBar
  - ButtonApp
  - Button
  - IconButton
  - CountButton
  - PlusBadge
  - NewsCard
  - ImpactCard
  - FeatureCover
  - RecommendationTicker
  - LearningModuleCard
  - LandscapeCover
  - SquareCover
  - CommentCell
  - CommentInputTrigger
  - VoiceCommentCell
  - ExpertOpinionCell
  - LinkEntryCell
  - ArticlePreviewCell
  - EmptyPlaceholder
  - Footer
  - FloatingIconButton
  - MicIcon
  - MicFillIcon
  - AudioPlayerBar
  - ArticleSummaryAudio
  - AudioProgressControl
  - UserAnswerBubble
  - AudioScriptParagraph
  - Icon16
  - Icon20
  - Icon24
  needs_componentization:
  - BottomBar
  - SettingsRow
  - SubscriptionSheet
  - PlanOptionCell
  - ExpertBubble
  - AIRadioControlCluster
  - AgeOptionRow
  generation_rule:
  - For ready_to_force components, do not hand-draw with rectangles/text/groups.
  - For needs_componentization patterns, follow page-recipes.md and report the gap.
  - For weak names like Frame 39/40/41, inspect source context before reuse.
  - Top-level channels preserve the source bottom-navigation container and use a TabBar variant; BottomBar
    remains a componentization gap until a live master exists.
  - For overlays, read references/component-overlays.md and choose Paywall Half Sheet, Floating Sheet, Definition
    Bubble, Option Popover, or Light Feedback by anchor and scene semantics before drawing.
