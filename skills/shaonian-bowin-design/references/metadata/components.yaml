patterns:
  cold_start_age_selection:
    source_nodes: []
    source_status: no_active_source_registered
    use_for:
    - first launch age choice
    - settings age edit sheet
    structure:
    - StarBaby/IP avatar header
    - question block
    - AgeOption rows
    - App Button primary/disabled state
    do_not:
    - turn onboarding into a marketing hero
    - use adult account/profile visual weight
  subscription_modal:
    source_nodes:
    - 2756:23531
    - 2756:23549
    - 2756:23270
    - 2756:23298
    - 2379:7061
    use_for:
    - paid popup from home
    - paid popup from profile
    - paid popup from locked Plus feature
    structure:
    - Overlay Black40 mask
    - Large bottom sheet
    - PlusBadge or source Plus/IP identity
    - plan choice area; production follows source, exploration may restructure
    - App Button primary action
    - weak cancel/close affordance
    do_not:
    - create full-page paywall for inline touchpoints
    - make profile paid entry stronger than user identity/content history
  profile_secondary_entry:
    priority: low
    use_for:
    - 换肤
    - 福利中心
    acceptable_treatments:
    - weak utility strip under UserCard
    - inline weak entry inside profile content block
    - grouped row with lower emphasis than history/content
    surface:
      fill: tokens.colors.background.card_or_block
      radius: tokens.radii.r20
      stroke: none
      shadow: none
    do_not:
    - make secondary utilities equal in visual weight to main content
    - insert a block that touches the content card below
  account_action_in_settings:
    use_for:
    - 切换账号
    treatment:
    - separate from ordinary settings rows with a larger vertical gap
    - less dangerous than logout
    - same row structure as SettingsRow
    do_not:
    - merge with logout button
    - style as a primary marketing CTA
