  fail_condition:
  - design files duplicate runtime motion token tables or framework-specific animation code
  - component documentation contains duplicate duration easing scale translate or opacity tables
  - an explicit runtime interaction request is reported as complete from static Figma states alone
bottom_sheet_type_check:
  required_for:
  - bottom_sheet
  - picker
  - share_sheet
  - login_prompt_sheet
  - subscription_modal_or_paid_entry
  - unlock_or_purchase_modal
  source:
  - references/component-overlays.md
  - references/metadata/components.yaml > SheetPicker
  required_records:
  - bottom_sheet_type
  - semantic_reason
  - sheet_instance_or_source_extension_check
  - edge_and_margin_check
  - responsive_width_check
  - close_button_position_check
  - padding_and_clipping_check
  - interaction_state_notes_when_interaction_requested
  type_rules:
    Floating Sheet:
      use_when:
      - ordinary_bottom_overlay
      - non_emphasized_picker
      - normal_selection
      - share
      - identity_or_font_choice
      - light_confirmation
      - login_prompt_without_purchase_decision
      must_have:
      - side_margins
      - bottom_breathing_room
      - full_corner_radius
      - light_visual_weight
      - width_min_100vw_minus_40px_400px
      - max_width_not_full_bleed_on_large_screens
      - bottom_center_position_on_large_screens
      must_not:
      - edge_attached_paywall_geometry
      - strong_benefit_illustration
      - aggressive_primary_cta
      - full_width_stretch_for_calendar_share_identity_or_font_picker
    Paywall Half Sheet:
      use_when:
      - paid_membership
      - subscription
      - unlock
      - purchase
      - strong_conversion
      must_have:
      - edge_attached_bottom_half_sheet
      - overlay_mask
      - fixed_close_control
      - one_primary_App_Button
      - centered_content_max_width_on_large_screens
      - weak_protocol_or_helper_text_when_present
      must_not:
      - look_like_light_picker
      - multiple_equal_primary_ctas
      - marketing_landing_page_tone
  fail_condition:
  - ordinary picker or share sheet uses Paywall Half Sheet geometry
  - paid/unlock/purchase flow uses Floating Sheet semantics
  - ordinary settings language font identity or option sheet is rebuilt from local Frames when SheetPicker
    or a matching source Floating Sheet is available
  - Floating Sheet option rows are local parallel row components without a source instance or same-family extension
  - sheet side margins or edge attachment contradict selected type
  - Floating Sheet exceeds 400px width without an explicitly requested special large-screen component
  - Floating Sheet stretches to full width on large screens without explicit semantic reason
  - calendar grid cells stretch horizontally to fill wide screens instead of staying compact and centered
  - Paywall Half Sheet content stretches indefinitely instead of using a centered max-width
  - close button drifts from source position in Paywall Half Sheet
  - price, protocol, option label, or action text is clipped
  - screenshot check omits zoomed dense region
anchored_popover_check:
