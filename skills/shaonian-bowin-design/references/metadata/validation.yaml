visual_query_delivery_check:
  required_for:
  - user_asks_what_a_page_component_asset_state_or_effect_looks_like
  - user_asks_to_see_a_visual
  - lookup_returns_cached_or_live_screenshot_evidence
  source:
  - references/metadata/task-routes.yaml > global_defaults.visual_query_delivery
  required_records:
  - visual_attachment_path
  - visual_attachment_allowed_root
  - platform_delivery_url_or_attachment_reference
  - visual_attachment_format
  - visual_attachment_size_bytes
  - visual_attachment_validation_status
  - final_attachment_markdown
  - visual_evidence_origin
  pass_conditions:
  - selected screenshot is persisted outside a temporary directory and inside an explicitly allowed root before
    final response
  - visual_attachment_path is absolute exists is nonempty has a recognized image signature and resolves inside
    the allowed root
  - platform returns a user-accessible delivery URL or attachment reference
  - python3 scripts/validate_visual_attachment.py returns valid true and delivery_ready true
  - final response includes validator returned markdown_image using the platform delivery URL
  - evidence origin is disclosed as exact current-turn gallery reference exact fresh cache or live Figma rendering
  - live transient variable-mode rendering is restored or cleaned before delivery
  fail_condition:
  - screenshot exists only in a tool result or commentary preview
  - final response omits the image requested by the user
  - final response uses a relative path local absolute path short-lived URL temporary path or plain-text path
    instead of a platform-accessible embedded image
  - visual_attachment_path resolves outside the allowed root
  - final response says 见上图 上图如下 已展示 or equivalent without a validated embedded image
  - attachment path is missing empty unreadable or has an unrecognized image signature
  - delivery claims success after persistence or validation failure
