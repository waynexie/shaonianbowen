source_context_preservation_check:
  required_for:
  - existing_context_local_mutation
  - existing_page_modification
  - local_interaction_modification
  - overlay_or_contextual_feedback_on_existing_context
  - local_state_change_on_existing_context
  source:
  - references/metadata/task-routes.yaml > routes
  - references/figma-workflow.md
  - references/figma-workflow.md > Existing Context Local Mutation Flow
  required_records:
  - task_route_type
  - context_strategy
  - context_basis
  - source_context_type
  - source_frame_id
  - source_screenshot_evidence
  - task_id
  - task_container_id
  - target_region
  - locked_regions
  - locked_source_layers_checked
  pass_conditions:
  - closest complete source Frame and exact source screenshot are resolved before writing
  - context_strategy_check passes for the requested draft or native production deliverable
  - source_locked_visual_draft preserves every non-target region through the locked source screenshot
  - native production preserves locked-region appearance with verified native source components and variables,
    with complete screenshot comparison
  - all delivered source-derived regions remain inside the screen; no orphan layers or unverified local lookalikes
  - target-region registered components pass registered_component_family_gate_check
  - task_atomic_output_check passes for ordinary output tasks
  fail_condition:
  - exact source Frame or strategy-specific evidence is missing
  - locked regions visually change outside the requested mutation scope
  - source_locked_visual_draft reconstructs any region outside target_region
  - native production uses a screenshot background or unverified source approximation
  - registered source components are replaced by primitives detached layers or flattened images
  - component access failure or MCP limits are used as permission to reconstruct the source
  - local one-off overlay nodes replace existing page skeleton navigation list cards or bottom bar
  context_strategy_ref: task-routes.yaml#global_defaults.context_strategy_routing
mutation_scope_check:
  required_for:
  - existing_context_local_mutation
  - existing_page_modification
  - local_interaction_modification
  - component_state_change_inside_existing_context
  source:
  - references/figma-workflow.md > Existing Context Local Mutation Flow
  - references/visual-failures.md
  required_records:
  - target_region
  - allowed_mutations
  - forbidden_mutations
  - directly_affected_sibling_stack_when_any
  pass_conditions:
  - only target_region and explicitly allowed affected siblings are changed
  - temporary surfaces are topmost overlays unless the requested state is explicitly inline expansion
  - any content movement is limited to directly affected sibling stack and uses token spacing
  fail_condition:
  - changes page background navigation status bar title body list card bottom bar or existing copy without
    explicit request
  - inserts temporary overlay into content Auto Layout stack and reflows unrelated modules
  - changes component style globally to solve a local state
  - changes information hierarchy outside the requested region
locked_context_unchanged_check:
  required_for:
  - existing_context_local_mutation
  - existing_page_modification
  - local_interaction_modification
  source:
  - references/figma-workflow.md
  - references/visual-failures.md
  required_records:
  - locked_regions
  - locked_region_visual_comparison
  - screenshot_regions_checked
  pass_conditions:
  - locked regions match source screenshot position style and content
  - ready-to-force components in locked regions remain instances or source variants
  - copied source background and header/background gradients remain unchanged
  - no locked region text content color radius shadow spacing or background changes
  fail_condition:
  - locked region coordinates or visual style drift
  - page or header background is redrawn, recolored, or replaced outside target_region
  - source page copy text changes outside target_region
  - header background card style feed title body text bottom bar or status bar differs from source without
    explicit request
  - screenshot check omits locked region comparison
mode_routing_check:
  required: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.mode_routing
  - matching profile_id section from references/screen-patterns.md when page_experience_profile_check is required
  interpretation:
  - production_mode is a source-preserving editing posture and does not mean quality_tier=production
  - exploration_mode controls structural freedom while existing shell protection remains independently enforced
  mode_selection:
    production_mode:
      triggers:
      - existing_context_local_mutation
      - existing_page_modification
      - local_interaction_modification
      - settings_modification
      - small feature insertion
      must_do:
      - preserve source structure unless targeted
      - reuse ready_to_force components
      - make minimum necessary mutation
      fail_condition:
      - rebuilds an existing context without explicit request
      - introduces a new visual system for a low-frequency utility
    exploration_mode:
      triggers:
      - 重新设计
      - 发散
      - 换一版
      - 不像原版
      - 样式不好看
      - output_multiple_frames
      must_do:
      - record divergence_contract before writing
      - use source screens as style reference, not layout template
      - change information architecture, surface model, decision path, or visual organization
      fail_condition:
      - only changes color, spacing, card size, or order
      - repeats the source layout as a near replica
      - keeps all local layouts framed the same way after the user questioned framing
feedback_intake_check:
  required_when:
  - user_says_remember
  - user_says_feedback_should_feed_skill
  - user_says_next_time_avoid
  - repeated_failure_in_thread
  - objective_quality_failure_reported
  - mode_failure_reported
