  source:
  - references/figma-workflow.md
  - references/component-audit.md
  - references/visual-failures.md
  applies_to:
  - status_bar
  - StatusBar
  - 状态栏
  - HomeHeaderBar
  - NavigationBar
  - existing_source_bottom_navigation
  - TabBar
  - NewsCard
  - LandscapeCover
  - SquareCover
  - Cover_or_Tag
  - Icon16
  - Icon20
  - Icon24
  - IconButton
  - Button
  - ButtonApp
  - CommentCell
  - LinkEntryCell
  - AudioProgressControl
  - SheetPicker
  - FloatingSheet
  - existing_page_context_ready_to_force_components
  must_not:
  - hand_draw_from_rectangles_text_or_vectors
  - detach_component_and_treat_as_final_reusable_structure
  - detach_component_and_deliver_as_local_final_structure
  - copy_instance_children_outside_component_to_fake_reuse
  - use_local_group_or_frame_as_parallel_component_family
  - replace_core_variables_or_text_styles_with_raw_values
  - source_compatible_local_rebuild
  - local_label_override_on_component
  - overlay_text_frame_on_button_or_cell
  - hand_draw_floating_sheet_when_source_instance_exists
  required_records_when_failed:
  - failed_gate
  - affected_region
  - missing_source_or_component
  - required_instances_checked
  - detached_or_localized_components_checked
  - safe_next_step
  instance_integrity:
    principle: inherited ready-to-force components must remain instances or same-family variants in the delivered
      screen.
    must_remain_instance_or_variant:
    - HomeHeaderBar
    - NavigationBar
    - existing_source_bottom_navigation
    - TabBar
    - NewsCard
    - IconButton
    - Icon16
    - Icon20
    - Icon24
    - ButtonApp
    - CommentCell
    - AudioProgressControl
    - SheetPicker
    allowed_changes:
    - edit exposed instance properties
    - edit editable child text inside the instance when safe
    - swap to an existing variant
    - create a same-family variant when the component task explicitly requires it
  fail_condition:
  - any ready_to_force component required by the route is represented by primitives instead of INSTANCE or
    variant extension
  - any ready_to_force component is detached and delivered as local frames groups vectors or flattened images
  - component instance children are copied out as local final structure
  - component is visually preserved but node type is FRAME GROUP VECTOR or flattened image
  - orphan ready-to-force component layer is left outside delivered screen frame
  - TabBar appears as local rectangles and text instead of a component instance
  - an existing source bottom-navigation wrapper is replaced by local rectangles or a reconstructed wrapper
  - NewsCard or its source card family appears as a hand-drawn card when the route requires NewsCard
  - icon is represented by emoji text character or hand-drawn temporary vector when Icon16 Icon20 Icon24 or
    approved Iconsax candidate is required
  - required component region contains node names such as Source-compatible local
  - status bar is made from local Time Battery Wi-Fi Service primitives instead of an instance or source variant
  - a component label or state is changed by placing a local override Frame/Text above the component
  - Floating Sheet is rebuilt as local Frames when SheetPicker or a matching source Floating Sheet is available
  - any ready-to-force component in the locked existing source shell is redrawn during fast visual exploration
  - local one-off overlay is used as a replacement for an existing ready-to-force context component
navigation_component_check:
  required_for:
  - top_level_channel_or_feed
  - existing_page_modification
  - detail
  - settings
  - immersive_audio_screen
  source:
  - references/component-navigation.md
  required_records:
  - navigation_type
  - header_or_navigation_component
  - bottom_bar_state_when_top_level
  - status_bar_instance_check
  - safe_area_check
  fail_condition:
  - header, back button, right icon, or TabBar is hand-drawn
  - an existing source bottom-navigation wrapper is deleted or reconstructed
  - status bar is hand-drawn from Time Battery Wi-Fi Service primitives
  - status bar node is named Source-compatible local or otherwise marked as a local approximation
  - a reusable bottom-navigation wrapper is claimed available without a live component master
  - BottomBar overlaps content, comment input, CTA, or audio controls
  - selected tab state uses a new visual grammar instead of source TabBar variants
audio_component_check:
  required_for:
  - immersive_audio_screen
  - audio_summary
  - podcast
  - voice_summary
  source:
  - references/component-audio.md
  required_records:
  - audio_context
  - audio_components_used
  - script_or_transcript_overlap_check
  - safe_area_audio_check
  conditional_records:
    legacy_or_new_progress_based_audio:
