intent_trigger_check:
  required: true
  source: references/figma-workflow.md
  required_records:
  - intent_trigger
  - task_route_type
  - task_mode
  existing_page_keywords:
  - 在...页新增
  - 在...页增加
  - 给...页加
  - 把...加到...页
  - 在现有页面
  - 基于现有页面
  - 已有页面
  - 详情页新增
  - 个人中心新增
  - 设置页新增
  - 首页增加
  - 加一个入口
  - 加一个功能
  - 新增入口
  task_mode_rules:
    existing_context_local_mutation:
      must_record:
      - source_frame_id
      - source_screenshot_evidence
      - task_id
      - task_container_id
      - target_region
      - locked_regions_if_user_scoped_request
      - allowed_mutations
      - forbidden_mutations
      - component_reuse_decision
      forbidden:
      - create_replacement_page_without_explicit_request
      - rebuild_source_context
      - mutate_unrelated_regions
    local_interaction_modification:
      default_for_keywords:
      - 评论
      - 语音评论
      - 输入框
      - 底栏
      - 操作栏
      - 回复
      - 点赞
      - 收藏
      - 分享
      forbidden_unless_targeted:
      - header
      - article_body
      - article_metadata
      - page_background
      - unrelated_modules
    new_top_level_channel:
      must_reuse_or_extend:
      - HomeHeaderBar
      - source_matched_bottom_navigation
      - TabBar
    prototype_to_visual_design:
      prototype_is:
      - information_structure
      prototype_is_not:
      - visual_style_authority
      - component_authority
  fail_condition:
  - user wording implies existing context local mutation but task_route_type is new_context_exploration
  - target_region is missing before write
  - existing context local mutation starts before source_frame_id source_screenshot_evidence and task_id are
    recorded
  - forbidden_mutations are not listed before write
  - unrelated source regions are changed
  - component_reuse_decision is missing
  - locked_regions are visually changed
feature_insertion_check:
  required_for:
  - existing_context_local_mutation
  - existing_page_modification
  - new_feature_entry
  - new_top_level_channel
  required_records:
  - feature_role
  - page_track
  - hierarchy_decision
  - placement_source
  - visual_weight
  - presence_role
  - attention_budget
  - default_state
  role_rules:
    primary_task:
      allowed_weight: high
      allowed_placements:
      - main_content_region
      - primary_card_area
    browsing_decision:
      allowed_weight: medium_high
      allowed_placements:
      - feed_card
      - list_item
    frequent_support_action:
      allowed_weight: medium
      allowed_placements:
      - related_module
      - inline_action
    low_frequency_utility:
      allowed_weight: low
      allowed_placements:
      - existing_profile_group
      - existing_settings_group
      - weak_utility_row
      forbidden:
      - primary_cta
      - standalone_equal_weight_card
    account_operation:
      allowed_weight: medium_low
      allowed_placements:
      - separate_account_group
      - settings_row_above_logout_with_group_gap
      forbidden:
      - merge_with_logout
      - primary_marketing_cta
    risk_or_exit_action:
      allowed_weight: isolated_special
      allowed_placements:
      - separated_bottom_action_area
  fail_condition:
  - feature role is not recorded
  - presence role attention budget or default state is not recorded for a new visible UI element
  - low-frequency utility appears as a primary visual module
  - persistent companion appears as a full-size primary component in its default state
  - account operation is merged with logout or styled as primary CTA
  - new feature creates a parallel component family without source justification
  - group spacing does not show task hierarchy
presence_role_fit_check:
  required_for:
  - existing_context_local_mutation
  - existing_page_modification
  - new_feature_entry
  - component_state_change
  - multi_option_exploration
  source:
  - references/metadata/task-routes.yaml > global_defaults.presence_role_taxonomy
  - references/feature-insertion.md
  - references/design-decision-matrix.md
  - references/design-quality.md
  required_records:
  - presence_role
  - attention_budget
  - default_state
  - component_semantic_reuse_decision
  - screenshot_region_used_for_role_fit
  role_rules:
    primary_surface:
      allowed_attention_budget:
      - high
      default_state:
      - expanded
    inline_entry:
      allowed_attention_budget:
      - medium
      - low
      default_state:
      - inline
      - collapsed
    contextual_state:
      allowed_attention_budget:
      - low
      - minimal
      default_state:
      - inline
    persistent_companion:
      allowed_attention_budget:
      - low
      - minimal
      default_state:
      - collapsed
      - hidden_until_triggered
      must_have:
      - lower_visual_weight_than_current_page_primary_content
      - compact_default_state
      - user_initiated_expanded_state_when_full_controls_are_needed
      - placement_avoids_primary_title_cover_body_bottom_bar_and_main_cta
      must_not:
      - use_full_source_component_as_default_state_when_it_competes_with_main_content
      - use_high_contrast_brand_or_dark_surface_without_source_or_state_reason
      - cover_current_page_primary_content_or_navigation
    transient_feedback:
      allowed_attention_budget:
      - minimal
      - low
      default_state:
      - hidden_until_triggered
    modal_decision:
      allowed_attention_budget:
      - high
      - medium
      default_state:
      - expanded
  component_reuse_rule:
  - reuse component semantics tokens states slots icon language and interaction meaning before reusing full
    visual size
  - when full component form exceeds the presence role budget extend the nearest component family with compact
    collapsed or local-state variant
  - do not create an unrelated local component family merely to reduce visual weight
  pass_condition:
  - the default visible state matches the selected presence role and attention budget in the full screenshot
  - expanded or stronger states are clearly user initiated or route justified
  - source component semantics are preserved even if the displayed form is compact
  fail_condition:
  - presence_role_fit_check is omitted for a new visible UI element
  - default visible state exceeds the selected attention budget
  - a persistent companion blocks or competes with the page's primary task
  - a full-size ready component is mechanically reused where a compact same-family state is required
  - a compact substitute drops the source component semantics icon language or token system
new_source_pattern_check:
  required_for:
  - cold_start_age_selection
  - comment_list_modification
  - profile_paid_or_login_state
  - subscription_modal
  source_refs:
    cold_start_age_selection:
