  - main card with radius below 20
  - large card with 999 radius
  - generated 350px content card with 28 radius
layout_check:
  alignment_grid:
    required_for:
    - subscription_modal
    - settings_rows
    - pricing_or_plan_selection
    - repeated_list_rows
    inspect:
    - shared_left_column_x_for_related_labels
    - shared_right_edge_for_prices_or_values
    - consistent vertical rhythm between title helper and value
    - no inherited text alignment causing visual drift inside oversized text boxes
    fail_condition:
    - related left labels or helper texts do not start from the same visual x
    - right-side prices or values do not share a clear right column
    - text appears centered or drifting because the text box is wider than its visual content without intent
    - spacing relies on eyeballing rather than an explicit grid or auto-layout row
  zoom_screenshot_check:
    required_for:
    - subscription_modal
    - compact_cards
    - bottom_sheet
    - any generated screen with pricing rows or dense text
    inspect_at_minimum:
    - full_frame_screenshot
    - zoomed_or_cropped_detail_of_dense_region
    - text_descenders_and_bottom_helpers
    - button_label_and_protocol_text
    fail_condition:
    - clipped text, cropped helper, hidden descender, or bottom text touching container edge
    - excessive empty padding inside a selected card or row
    - metadata appears valid but screenshot shows visual defect
    - final response claims validation passed without screenshot-level inspection of the dense region
  variant_divergence:
    required_when_user_asks:
    - 重新设计
    - 发散
    - 换一版
    - 不要和原版太像
    inspect:
    - changed_information_architecture
    - changed_surface_model
    - changed_decision_path
    - not_only_color_spacing_or_card_size_changes
    fail_condition:
    - new version remains the same card/list pattern with only size or spacing changes
    - all plans are still framed the same way when user explicitly questions card framing
    - design feels like a minor restyle rather than a different layout direction
  settings_rows:
    component_ref: references/metadata/components.yaml#components.SettingsRow
    must_match: the selected live SettingsRow variant layout; historical row geometry is not a new-instance recipe
    auto_layout_required: true
    helper_text_must_match: helper typography of the selected source instance or same-family variant
  profile_secondary_entries:
    must_be_lower_priority_than:
    - UserCard
    - history/content list
    no_touching_adjacent_modules: true
    gap_required: source_or_token_gap
  feed_cards:
    repeated_gap: tokens.spacing.s16
    content_footer_density: low_to_medium
  bottom_safe_area:
    required_gap_above_bottom_bar: 16
  generated_layout_containers:
    auto_layout_required_for:
    - main_page_stack
    - card_list
    - comment_list
    - settings_row_group
    - modal_sheet_stack
    - tab_or_chip_row
    - radio_control_row
    group_forbidden_as_layout_container: true
    group_allowed_only_for:
    - source_component_internal_nodes
    - existing_uneditable_historical_nodes
    - non-layout decorative source asset wrappers
    fail_condition:
    - new main/list/module layout is GROUP
    - repeated items are manually positioned while a vertical/horizontal auto layout is expected
    - text changes would cause overlap because parent lacks auto layout
component_family_check:
  component_audit_reference: references/component-audit.md
  status_rules:
    ready_to_force:
      must_use_as: instance_or_variant
      fallback_policy: stop
      forbidden:
      - hand_draw_from_primitives
      - substitute_with_generic_card
      - substitute_with_local_group
    usable_with_recipe:
      must_follow:
      - references/page-recipes.md
      - route.allowed_local_layout
      report_when_local:
      - component_gap
      - why_local_layout_allowed
    needs_componentization:
      must_report:
      - needs_componentization_references
      allowed_only_if:
      - page_recipe_documents_local_layout
  minimum_instance_count_source: metadata/task-routes.yaml routes.*.minimum_instance_count
  header: {}
  bottom_navigation: reuse_existing_tabbar_variant_before_extending
  feed_cards: extend_newscard_or_existing_card_family_first
  icons: use_icon_component_or_deposit_iconsax_candidate_first
  required_reuse:
    profile_lists:
    - ArticlePreviewCell
    - EmptyPlaceholder
    subscription_modal:
    - PlusBadge_or_source_plus_identity
    - ButtonApp
    - Paywall Half Sheet from references/component-overlays.md
    - source Subscription Modal geometry or SheetPicker.Type5
    - IconButton_or_source_close
    comments:
    - CommentInputTrigger
    - CommentCell
    - VoiceCommentCell_when_voice_comment
    navigation:
    - source_matched_bottom_navigation_when_top_level
    - TabBar_when_top_level
  fail_condition:
  - creates parallel family while source family can be extended
  - hand-draws a component that exists in the library
  - ready_to_force component is replaced with local primitives
  - generated screen has fewer component instances than route.minimum_instance_count without explanation
  - uses a NewsCard for 查看全部文章 instead of LinkEntryCell
  - claims a local_source_pattern as a formal component
structure_audit:
  required: true
  inspect:
    node_subtree: generated_or_modified_screen
    counts:
    - INSTANCE
    - COMPONENT
    - COMPONENT_SET
    - FRAME
    - GROUP
    required_checks:
    - route.minimum_instance_count met or component_gap reported
    - every route.must_use_components component is present or blocked before delivery
    - existing context tasks pass context_strategy_check and preserve locked regions outside the requested
      mutation
    - key containers listed in route.required_auto_layout_containers have layoutMode
    - no GROUP node is used as a new layout container
    - no ready_to_force component was hand-drawn
    - no ready_to_force component was detached into local frames/groups/vectors for final delivery
    - key ready_to_force components are INSTANCE nodes or documented variant extensions
    - page background and header/background gradients are preserved from source in locked regions
    - target-region or native-output TabBar remains an instance; untouched draft navigation stays in the locked
      source screenshot
    - NewsCard and card-family components remain component instances when required
    - all allowed local layouts are listed in route.allowed_local_layout or the current execution evidence
  pass_condition:
  - structure_audit report is included
  - missing required instances are fixed or delivery stops with failed_gate
  fail_condition:
  - structure_audit omitted
  - instance count is below route minimum with no blocker
  - local primitive replacement is used for a ready_to_force component
  - source frame was approximated without the verified source basis required by the selected context strategy
  - ready_to_force component appears as detached local layers in the final output
  - source background, header background, or locked feed/card modules were recreated
  - required ready_to_force component count is zero when the route requires it
  - layout GROUPs appear in generated new content
design_quality_audit:
  required: true
  source:
  - references/design-language.md
  - references/design-decision-matrix.md
  - matching profile_id section from references/screen-patterns.md when available
  - references/visual-failures.md
  inspect:
  - main_task_visible_within_3_seconds
  - information_priority_matches_route
  - surface_choice_matches_page_type
  - visual_weight_matches_feature_role
  - presence_role_matches_attention_budget_and_default_state
  - page_feels_like_shaonian_bowen
  - not_marketing_not_game_not_adult_dashboard
  - media_or_ip_is_real_or_source_like_when_needed
  - alignment_and_padding_are_professional_at_zoom_level
  - redesign_has_meaningful_layout_divergence_when_requested
  pass_condition:
  - delivery includes design_quality_audit summary
  - core information is not crowded by weak metadata
  - page remains credible light learning and youth friendly
  fail_condition:
  - design_quality_audit omitted
  - output is just mechanically assembled components with unclear main task
  - page looks like generic news app education app sales page or entertainment audio app
  - fields are kept by shrinking important text below token scale
  - visible alignment drift, clipped text, or abnormal padding remains in the final screenshot
  - requested redesign is only a small rearrangement of the original layout
failure_remediation:
  purpose: required response when validation or component reuse fails
  default_rule: stop_before_writing_or_before_reporting_success
  report_fields:
  - failed_gate
  - missing_source_or_component
  - affected_region
  - attempted_fix
  - safe_next_step
  hard_stop_cases:
    component_resolution_or_instance_creation_failed:
      applies_to:
      - status_bar
      - HomeHeaderBar
      - navigation_bar
      - bottom_bar
      - TabBar
      - NewsCard
      - Cover_or_Tag
      - Icon16
      - Icon20
      - Icon24
      - CommentCell
      - LinkEntryCell
      - SheetPicker.Type5
      - PlusBadge
      - AudioProgressControl
      must_do:
      - stop
      - report missing component or instance creation failure
      must_not:
      - hand_draw_replacement
      - use_parallel_local_family
    primitive_substitution_hard_fail:
      must_do:
      - stop
      - report affected ready_to_force component and region
      - restore or instantiate the local source component before delivery
      must_not:
      - mark_validation_passed
      - describe primitive replacement as high fidelity
      - use binding_gap to justify missing core source components or variables
    locked_region_visual_changed:
      must_do:
      - revert_or_preserve_locked_region_before_delivery
      - rerun_screenshot_visual_check
      must_not:
      - mark_validation_passed
      - explain_change_as_minor_polish
    route_component_missing:
      examples:
        subscription_modal: PlusBadge
      must_do:
      - inspect source node listed in task-routes.yaml
      - if source still unavailable, stop and report blocker
      must_not:
      - replace with generic card
      - replace with text-only row without source justification
    visual_screenshot_failed:
      fail_examples:
      - clipped text
      - overlap
      - bottom bar covers content
      - status bar not full width
      - in-product rationale text
      - misaligned repeated row labels or price columns
      - abnormal internal padding in cards, rows, buttons, or protocol text
      must_do:
      - fix layout or component choice
      - take another screenshot-level check
      max_local_fix_attempts: 1
      terminal_status_after_failed_recheck: validation_failed_do_not_deliver_option
      must_not:
      - rely on metadata-only validation
      - deliver with known screenshot defect
    structure_audit_failed:
      must_do:
      - fix missing instances or auto layout
      - rerun structure_audit before delivery
      must_not:
      - mark validation passed with missing must_use_components
      - keep local primitive replacement for ready_to_force components
    design_quality_audit_failed:
      must_do:
      - revisit design-language and decision matrix
      - reduce weak fields or adjust visual weight
      - rerun screenshot_visual_check
      must_not:
      - defend the output only because tokens or components were used
    token_binding_gap:
      enforcement_ref: references/metadata/validation.yaml#minimum_token_binding_check
      applicability: only the referenced policy decides whether a binding finding blocks; placement under
        hard_stop_cases does not make draft binding gaps unconditional failures
      must_do:
      - bind variable when technically possible
      - record node property intended source and reason once in the shared task evidence
      - apply the referenced quality tier and dependency-verification outcome
      must_not:
      - silently keep raw value because it visually matches
      - treat unavailable source definitions or missing registered components as ordinary draft binding gaps
      - claim production delivery while core bindings remain unresolved
visual_draft_maturity_check:
  required: true
  pass_condition:
  - screenshot looks like a visual design draft
  - not merely a wireframe or block layout
  - key images are real/source-like when the page depends on media
  - selected states are visible and polished
  - primary action hierarchy is clear
  fail_examples: {}
screenshot_visual_check:
  required: true
  delegates_to: universal_basic_visual_qa_check
  inspect:
  - full_frame_screenshot
  - zoomed_or_cropped_dense_region_when_present
  - unexpected_visible_overlap_after_exclusions
  - clipped_or_cropped_text
  - abnormal_padding
  - alignment_drift
  - bottom_bar_covering_content
  - locked_region_visual_change
  - 390px_status_bar_width
  - product_visible_design_rationale_or_scheme_names
  fail_condition:
  - any unexpected visible overlap remains after documented exclusions
  - status bar is 375px or visibly not full-width on a 390px screen
  - design notes,方案 labels, or rationale appear inside product UI
  - screenshot was not checked before reporting validation passed
  - dense region was not checked at zoom/crop level when pricing, protocol, comments, or settings rows are
    present
universal_basic_visual_qa_check:
  required_for: every_generation_or_figma_write_request
  scope:
    primary: current_created_or_modified_region
    additionally_check:
    - complete frame safety boundaries
    - locked regions when an existing page is modified or redesigned
  evidence_required:
  - full_frame_screenshot_actually_inspected
  - checked_region_ids_or_names
  - detected_basic_failures
  - excluded_overlap_pairs_with_reason
  - locked_region_comparison_when_applicable
  inspect:
  - unexpected_visible_overlap_after_exclusions
  - text_icon_button_protocol_clip_or_overflow
  - key_entry_readability_and_icon_integrity
  - repeated_edge_center_and_baseline_alignment
  - repeated_spacing_rhythm_and_group_spacing_hierarchy
  - status_navigation_bottom_bar_and_safe_area_occlusion
  - primary_task_and_primary_visual_focus
  - locked_context_visual_change
  allowed_overlap_exclusions:
  - button_internal_icon
  - text_over_media_with_legible_treatment
  - popover_toast_mask_or_explicit_overlay
  - inherited_component_decoration
  - node_explicitly_marked_intentional_overlay
  universal_blocking_failures:
  - unexpected_visible_overlap
  - content_clipped_or_overflowing
  - alignment_drift
  - spacing_rhythm_failure
  - safe_area_or_bottom_bar_occlusion
  - key_entry_unreadable_or_icon_missing
  - primary_task_or_focus_unclear
  - locked_context_changed
  - screenshot_not_checked
  remediation:
    max_local_fix_attempts: 1
    recheck_required_after_fix: true
    still_failing: validation_failed_do_not_deliver_option
dark_mode_validation_check:
  required_when:
  - quality_tier_is_production_and_dark_mode_is_applicable
  - user_explicitly_requests_dark_mode
  inspect_and_report_when:
  - inspiration_draft
  - precision_draft
  draft_gap_values:
  - dark_mode_not_verified
  - dark_mode_incomplete
  production_blocking_failures:
  - dark_mode_variable_resolution_failed
  - dark_mode_full_frame_not_checked
  - dark_mode_key_region_visual_failure
appearance_mode_default_check:
  required_for:
  - every_visual_figma_write
  - generated_design
  - existing_context_local_mutation
  - continuation_iteration
  source:
  - references/metadata/task-routes.yaml > global_defaults.appearance_mode_routing
  required_records:
  - appearance_mode
  - current_turn_explicit_mode_evidence
  - output_frame_variable_mode
  - full_frame_screenshot_mode
  pass_conditions:
  - appearance_mode is light_default when the current user turn does not explicitly request or preserve dark
    mode
  - dark output is used only when current_turn_explicit_mode_evidence contains explicit dark night or preserve-current-dark
    wording
  - output frame variable mode and validated full-frame screenshot mode match appearance_mode
  - prior lookup conversation workspace source-node and reference-image modes are not treated as current-turn
    mode evidence
  blocking_failures:
  - appearance_mode_missing
  - implicit_dark_mode_inheritance
  - output_mode_does_not_match_current_turn
  - output_frame_and_validation_screenshot_mode_mismatch
project_asset_lookup_check:
  required_for:
  - project_asset_lookup
  - starbaby_or_ip_asset_lookup
  - icon_lookup
  - component_lookup
  - material_lookup
  source:
  - references/source-index.md > Project Asset Lookup Sources
  - references/metadata/task-routes.yaml > routes.project_asset_lookup
  required_records:
  - source_nodes_checked
  - lookup_method_used
  - visual_candidates_with_source_nodes
  - recommended_candidate
  - external_search_requested_by_user
  source_priority_refs:
  - source_registry.use_for=project_asset_lookup
  - source_registry.use_for=expression_lookup
  - source_registry.use_for=image_source
  - source_registry.use_for=icon_lookup
  - source_registry.use_for=icon_candidate
  weak_naming_policy:
    names_are_hints_only: true
    must_not_fail_only_because_name_missing: true
    must_use:
    - source_area
    - parent_or_section_context
    - node_type_component_or_instance_metadata
    - dimensions_or_visual_role
    - screenshot_or_thumbnail_visual_scan
    - real_page_usage_when_available
  fail_condition:
  - returns internet image or clipart before checking Figma source nodes
  - uses web search without explicit user request for external reference
  - returns an asset without verified Figma source evidence when the user asked to find an existing one
  - fails lookup only because layer/component names are missing or wrong
  - omits source_nodes_checked or visual_candidates_with_source_nodes
multi_solution_check:
  required_when:
  - user_requests_multiple_solutions
  - output_multiple_frames
  - exploration_mode_with_redesign_request
  required_records:
  - design_thesis_per_option
  - option_difference_result
  valid_difference_axes:
  - information_hierarchy
  - operation_path
  - container_or_surface_model
  - visual_organization
  - content_focus
  invalid_difference_axes:
  - color_only
  - copy_only
  - shadow_only
  - option_name_only
  - tiny_spacing_only
  pass_condition:
  - every option has a distinct one-sentence design_thesis
  - every option demonstrates at least one meaningful task-relevant difference axis
  fail_condition:
  - options only change copy title colors shadows option names or tiny spacing
  - design theses are missing or materially equivalent
execution_evidence_handoff_contract:
  owner: design_skill
  orchestration_owner: agent
  mechanical_execution_owner: agent_using_available_tools
  purpose: preserve only evidence needed to trust the design decision and validation result
  required_evidence:
  - route_decision_and_real_gate_status
  - resolved_source_or_target_and_write_scope
  - screenshot_qa_result_and_known_visual_gaps_when_applicable
  - validated_visual_attachment_when_user_requests_a_visual
  must_not_define:
  - tool_call_order
  - retry_or_timeout_policy
  - final_response_layout
  - exact_platform_transport_implementation
  - non_visual_link_format
  - user_visible_field_list
  transparent_platform_boundary:
    allowed:
    - request_forwarding
    - ordered_process_and_result_display
    - canvas_transport_and_display
    - task_bound_annotation_feedback
    - authentication_rate_limit_timeout_reconnect_idempotent_retry_file_transfer
    - session_isolation
    forbidden:
    - business_routing
    - shaonian_bowin_term_interpretation
    - figma_query
    - page_or_node_counting
    - appearance_mode_decision
    - authority_selection
    - business_prompt_or_result_template
    - result_rewrite_summary_completion_or_reordering
    - failure_replacement
    - cross_task_context_inheritance
    - business_answer_cache
    result_postprocessed: false
  must_not_weaken:
  - lookup_readonly_boundary
  - source_node_resolution
  - figma_generation_or_mutation_flow
  - screenshot_visual_check
  - source_protection_gates_for_every_quality_tier
  - production_component_and_token_gates
  - universal_basic_visual_qa_check
structured_annotation_execution_check:
  required_when:
  - request_contains_structured_annotations
  - canvas_box_or_arrow_feedback_is_submitted
  required_evidence:
  - target_file_key
  - target_node_id
  - target_scope
  - surface_id
  - coordinate_space
  - normalized_start_and_end
  - surface_bounds
  - annotated_screenshot_when_available
  pass_condition:
  - target file and node are resolved before mutation
  - normalized coordinates map to the same visual region as the attached annotated screenshot
  - only the annotated region and explicitly dependent elements are changed
  - the resulting screenshot proves the requested delta at the intended region
  fail_condition:
  - target is inferred only from annotation text
  - preview pixels are treated as source-node pixels without scale conversion
  - screenshot location and structured coordinates disagree
  - mutation affects an unrelated region
  - result claims completion without checking the annotated target region
  failure_status: structured_annotation_scope_mismatch
responsive_layout_check:
  required_for:
  - component_or_variant_design
  - new_native_screen
  - native_layout_mutation
  authority: task-routes.yaml#global_defaults.responsive_layout_policy
  must_check:
  - six_width_geometry
  - narrow_and_wide_screenshot
  - long_text_wrapping
  - hidden_control_reclaims_space
  - scroll_and_safe_area_when_screen_modified
  failure_status: responsive_layout_gap
scene_index_first_check:
  required_when: scene or component lookup and any design write that uses components
  policy_ref: task-routes.yaml#global_defaults.scene_index_first_policy
  required_records:
  - index_lookup_result
  - resolved_family_ids
  - resolution_stage
  - live_master_evidence_for_write
  - fallback_reason_when_search_used
  pass_conditions:
  - ordinary locating uses index evidence without unnecessary master scan
  - write tasks verify exact current masters and reuse instances
  - missing or stale mapping uses bounded search
  - review matrix is never treated as a master or validation proof
  blocking_failures:
  - design_write_uses_only_index_without_live_master_evidence
  - review_instance_treated_as_authoritative_master
  - full_library_scan_without_recorded_need
quality_evaluator_contract:
  purpose: validate supplied quality evidence; never inspect pixels or authorize Figma writing or final delivery
  result_scope: reported_quality_evidence_only
  complete_route_validation: false
  sources:
    quality_tiers: task-routes.yaml#global_defaults.quality_tier_routing.values
    basic_failures: validation.yaml#universal_basic_visual_qa_check.universal_blocking_failures
    component_failures: validation.yaml#registered_component_family_gate_check.blocking_failures
    production_gaps: validation.yaml#production_gaps_check.allowed_values
    difference_axes: validation.yaml#multi_solution_check.valid_difference_axes
    reference_sources: validation.yaml#external_reference_check.evidence_source_types
  required_input:
  - quality_tier
  - screenshot_checked
  - detected_basic_failures
  - production_gaps
  - component_resolution_checked
  - registered_component_families
  registered_family_evidence_ref: registered_component_family_gate_check.required_records
  registered_family_rule: every matched family supplies nonempty source/delivery IDs, explicit property changes
    (empty list allowed), and target_region_screenshot_check=true; empty families are valid only after component_resolution_checked=true
  input_validation: require JSON object, exact boolean true for completed checks, arrays for failures gaps
    and families; reject unknown gaps and reported failures
  final_delivery_rule: passed covers only this evidence slice; Agent separately verifies write scope context
    native structure tokens responsive behavior and every applicable route gate before final delivery
