  required_records:
  - feedback_type
  - feedback_level
  - feedback_intake_decision
  - generalized_rule
  - storage_target
  - generalized_regression_pattern
  allowed_feedback_types:
  - visual_failure
  - layout_failure
  - mode_failure
  - component_failure
  - style_language_gap
  - content_hierarchy_gap
  fail_condition:
  - emotional feedback is copied verbatim instead of converted to a check
  - generalized feedback is not stored in a reference or validation gate
  - final delivery omits feedback_rules_applied when relevant
  - agent does not suggest capture/promote for repeated or objective quality failures
interaction_state_scope_check:
  required_when:
  - task_involves_interaction
  - prototype_requested
  - code_project_motion_requested
  - navigation_or_route_transition_created
  - secondary_page_created_or_modified
  - temporary_component_created
  - page_transition_requested
  - clickable_card_or_button_created
  source:
  - references/metadata/task-routes.yaml > global_defaults.persistent_write_scope
  - component reference files for component intent only
  required_records:
  - interaction_state_notes
  - interaction_scope
  - component_context
  must_have:
