  fail_condition:
  - relevant source nodes were not inspected when Figma MCP was available
  - local assets were used as authority while live Figma source existed
bound_variable_check:
  applicability_ref: references/metadata/validation.yaml#minimum_token_binding_check
  enforcement_ref: references/metadata/validation.yaml#minimum_token_binding_check
  evidence_ref: references/metadata/validation.yaml#pre_generation_checks.decision_records.evidence_reuse_contract
  inspect:
    node_subtree: generated_or_modified_screen
    properties:
    - fills
    - strokes
    - text fills
    - fontSize
    - lineHeight
    - corner radius variables
    - padding
    - itemSpacing
    - effects when present
  pass_condition:
  - eligible nodes have boundVariables
  - non-core raw fallback is listed in binding_gap with node id property and non-core justification
  incomplete_binding_conditions:
  - core token node visually matches token but has no binding
  - non-core node visually matches token but has no binding and no binding_gap
  result_handling: pass binding findings to minimum_token_binding_check; an incomplete binding is not an
    unconditional draft failure; never bypass dependency verification or registered component reuse
surface_check:
