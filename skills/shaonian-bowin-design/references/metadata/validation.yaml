  source:
  - references/metadata/tokens.yaml > radii
  - references/design-language.md > Surface And Tokens
  allowed_non_pill_values:
  - 8
  - 12
  - 20
  max_non_pill_radius: 20
  pill_value: 999
  r20_required_for:
  - main cards
  - large containers
  - settings rows
  - profile blocks
  r12_only_for:
  - media thumbnails
  - compact image slots
  - small internal blocks
  pill_required_for:
  - buttons
  - chips
  - tabs
  - filter pills
  - icon buttons
  allowed_exceptions:
  - existing_source_component_explicitly_uses_non_token_radius
  - source_instance_preserved_without_local_override
  blocking_failures:
  - non_pill_rectangle_uses_radius_above_20_without_source_component_evidence
  - generated_card_block_sheet_or_panel_uses_local_radius_24_28_or_32
  fail_examples:
