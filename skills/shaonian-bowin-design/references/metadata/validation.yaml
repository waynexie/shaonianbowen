  - reply
  - voice_comment
  - discussion_list
  source:
  - references/component-comments.md
  required_records:
  - comment_components_used
  - reply_hierarchy_check
  - voice_comment_check_when_present
  - comment_zoom_regions_checked
  fail_condition:
  - CommentInputTrigger, CommentCell, or VoiceCommentCell is hand-drawn while available
