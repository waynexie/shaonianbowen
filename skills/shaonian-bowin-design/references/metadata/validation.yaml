schema_version: 1
purpose: fixed generation and delivery checks for Shaonian Bowen Figma screens
authority: 'Single source of truth for all generation/delivery gates, design_check fields, and degradation
  gate checks. SKILL.md and references/*.md only reference these checks; if md and this file disagree, this
  file wins. Term glossary (English snake_case -> Chinese): references/metadata/glossary.yaml.

  '
pre_generation_checks:
  read_order:
    always:
    - selected execution profile through python3 scripts/read_execution_profile.py
    - matched source/component/asset records through python3 scripts/query_runtime_index.py when target resolution
      is needed
    - smallest required authority sections through python3 scripts/read_metadata_section.py before write or
      when runtime evidence is ambiguous or stale
    by_route_profile:
      lookup_profile:
      - exact uploaded current-turn gallery reference when its file key node id state and appearance mode match
        the resolved target
      - otherwise matched lookup runtime record only
      - exact fresh local cache by default; live Figma only for latest/realtime, state mismatch, ambiguity,
        stale/missing cache or definitive absence
      - fixed generated-output page only when explicitly requested
      local_mutation_profile:
      - selected local mutation execution profile and exact target runtime record
      - smallest matching task-routes validation and source-frames authority sections needed for the write
      - relevant component or icon family only when touched
      - matching screen-patterns.md profile only when page_experience_profile_check is required
      - full figma workflow page recipe and design-system references only for structural change productionization
        or unresolved ambiguity
      exploration_profile:
      - references/design-language.md
      - matching profile_id section from references/screen-patterns.md
      - references/metadata/tokens.yaml
      - references/metadata/components.yaml
      - relevant_component_reference
      continuation_profile:
      - previous conversation output context
      - live generated-output metadata for referenced nodes when available
      - newly touched component reference only when the delta introduces a new component family
      - matching screen-patterns.md profile only when the delta changes structure, module role, hierarchy,
        or state model
      component_profile:
      - references/metadata/components.yaml
      - references/metadata/source-registry.yaml
      - references/figma-workflow.md
      - references/component-audit.md
      - relevant_component_reference
      - matching screen-patterns.md profile only for real-page-context validation
      feedback_profile:
      - references/feedback-intake.md
      - references/visual-failures.md
  figma_required_reads:
    applies_to:
    - local_mutation_profile
    - exploration_profile
    - component_profile
    - productionization
    values:
    - variables required by the touched region
    - text styles required by the touched region
    - effect styles required by the touched region
    - nearest source screen metadata
    - nearest source screen screenshot
    - relevant component family metadata
  decision_records:
    evidence_reuse_contract:
      storage: one_shared_task_evidence_record_with_per_option_node_and_screenshot_references
      selection: union_of_selected_profile_fields_and_applicable_gate_fields_only
      reuse: each field is recorded once and consumed by all applicable checks; different checks may inspect
        the same screenshot or component record without requesting a duplicate report
      freshness: reuse only for the same target state mode and current revision; recapture changed regions
      reporting: summarize outcome and unresolved issues; do not dump every internal field into the user response
      guide_policy: Markdown examples explain decisions but never add required fields
    route_profile_based: true
    required_for_all:
    - metadata_loaded
    - route_decision
    required_for_all_generation:
    - quality_tier
    - appearance_mode
    - basic_visual_gate
    - production_gaps
    optional_when_relevant:
    - turn_intent_contract
    - design_check
    - speed_tier_decision
    - presence_role
    - attention_budget
    - default_state
    - component_gap
    - exploration_substitute
    - must_not_ship_as_production
    - feedback_rules_applied
    - known_failure_checks
    - screenshot_regions_checked
    - productionization_gap
    - minimum_token_binding_plan
    - minimum_token_binding_result
    - raw_visual_sketch
    required_by_profile_ref: task-routes.yaml#route_profiles
    profile_field_selection: read required_fields and conditional fields from the selected route profile; this
      gate verifies them without maintaining a second field list
route_profile_check:
  required: true
  source:
  - references/metadata/task-routes.yaml
  pass_conditions:
  - selected route profile matches semantic intent
  - only the selected profile minimum fields are required
  - lookup profile never writes Figma
  - write or generation profiles include turn_intent_contract before component selection
  - local mutation profile records source duplication before mutation
  - exploration profile records divergence_contract instead of superficial divergence_axis
  - component profile records nearest component family and slot/resizing risk
  fail_conditions:
  - applying full production preflight to lookup task
  - writing Figma when selected profile is lookup_profile
  - missing route_decision before choosing references
  - component or recipe selection happens before explicit current-turn constraints are extracted
quality_tier_check:
  required_for: every_generation_or_figma_write_request
  source:
  - references/metadata/task-routes.yaml > global_defaults.quality_tier_routing
  independent_axes:
  - task_route_type
  - speed_tier
  - quality_tier
  precedence:
  - explicit production or final-delivery signal selects production
  - explicit redesign multi-option or exploration signal selects inspiration_draft
  - existing-context local change without exploration selects precision_draft
  - new design without existing target or production language selects inspiration_draft
  - ambiguous lookup versus generation stays readonly until resolved
  pass_conditions:
  - every generation record contains exactly one quality_tier
  - existing-context redesign may select inspiration_draft while existing shell and non-target regions remain
    locked
  - readonly lookup does not enter generation QA
  blocking_failures:
  - generation_started_without_quality_tier
  - production_signal_routed_to_draft
  - ambiguous_lookup_or_generation_written_without_resolution
  values_ref: task-routes.yaml#global_defaults.quality_tier_routing.values
production_gaps_check:
  required_for: every_generation_or_figma_write_request
  allowed_values:
  - token_binding_incomplete
  - style_binding_incomplete
  - auto_layout_or_component_properties_not_production_ready
  - dark_mode_not_verified
  - dark_mode_incomplete
  - unregistered_new_componentization_gap
  excluded_blocking_failures:
  - registered_component_family_gate_failed
  - required_instance_or_source_extension_unresolved
  - registered_component_replaced_by_local_primitives
  behavior_by_quality_tier:
    inspiration_draft:
      behavior: pass_when_basic_visual_and_registered_component_family_gates_pass_and_return_allowed_gaps
      must_not_claim_production: true
    precision_draft:
      behavior: pass_when_source_protection_basic_visual_and_registered_component_family_gates_pass_and_return_allowed_gaps
      must_not_claim_production: true
    production:
      behavior: every_unresolved_gap_is_blocking
      must_not_claim_production: true_when_any_gap_remains
registered_component_family_gate_check:
  required_for: every_generation_or_figma_write_request
  source:
  - references/metadata/task-routes.yaml > global_defaults.registered_component_family_gate
  - references/metadata/components.yaml
  - references/component-overlays.md
  precedence: higher_than_speed_tier_quality_tier_context_strategy_and_production_gaps
  required_when:
  - route declares must_use_components or primary_components
  - component catalog marks a family ready_to_force or required_instance
  - source-index or live Figma resolves a nearest same-semantic component family or source instance
  required_records:
  - resolved_component_family
  - source_component_or_instance_node_id
  - delivered_instance_or_same_family_extension_node_id
  - component_property_or_variant_changes
  - target_region_screenshot_check
  pass_conditions:
  - registered components remain INSTANCE nodes existing variants or documented same-family extensions
  - recipe-governed components start from the registered instance or nearest matching source instance
  - source and delivery node evidence matches the requested semantic family
  blocking_failures:
  - registered_component_family_gate_failed
  - registered_component_replaced_by_local_frames_groups_vectors_or_flattened_image
  - required_instance_or_source_extension_unresolved
  - parallel_component_family_created_while_registered_family_exists
  - component_source_or_delivery_evidence_missing
turn_intent_contract_check:
  required_when:
  - local_mutation_profile
  - exploration_profile
  - continuation_profile
  - component_profile
  - figma_write
  - multi_option_generation
  source:
  - references/metadata/task-routes.yaml > turn_intent_contract
  principle: current-turn explicit user constraints outrank default recipes and full component shapes, while
    source protection, core tokens, and component semantics remain protected.
  required_fields:
  - user_goal
  - explicit_user_constraints
  - excluded_fields_or_elements
  - required_fields_or_elements
  - occlusion_budget
  - locked_context
  - component_semantic_reuse_policy
  - conflict_resolution
  pass_conditions:
  - explicit must only avoid do-not constraints are extracted before component choice
  - user-excluded fields or elements are not reintroduced by default component slots
  - required fields or elements remain visible and readable unless hard-stopped
  - component reuse preserves semantics tokens icons states and interaction meaning before preserving full
    geometry
  - conflicts between turn intent and component defaults are recorded as skill_rule_overridden_by_turn_intent
    or ask_or_degrade
  fail_conditions:
  - explicit_user_constraint_ignored
  - excluded_field_reintroduced_by_component_default
  - component_default_overrides_user_prompt
  - full_component_shape_used_when_turn_requests_lightweight_or_low_attention_presence
  - occlusion_budget_missing_when_user_mentions_do_not_cover_or_avoid_blocking_content
  - multiple_options_ignore_requested_difference_axis
  - current_turn_reference_image_or_markup_ignored
mode_validity_check:
  required_before_figma_write: true
  source:
  - references/metadata/task-routes.yaml > route_profiles
  - references/figma-workflow.md > Before Write
  principle: every Figma write must be either source-preserving, materially exploratory, or component-family
    scoped.
  required_record:
  - mode_validity
  valid_results:
  - local_mutation_valid
  - exploration_valid
  - component_valid
  - readonly_valid
  valid_mode_requirements:
    local_mutation_valid:
      must_have:
      - context_strategy
      - context_basis
      - source_frame_id
      - source_screenshot_evidence
      - task_id
      - task_container_id
      - output_page_id
      - target_region
      - locked_regions
      - selected_context_strategy_check_passed
      - task_atomic_output_check_passed
      - top_level_canvas_collision_check_passed
      must_not:
      - source_like_reconstruction_without_verified_context_basis
      - source_background_or_locked_region_visually_changed
      - source_context_reconstruction_from_primitives
    exploration_valid:
      must_have:
      - divergence_contract
      - material_difference_between_options_when_multiple
      - source_style_preserved_or_translated
      must_not:
      - near_replica_reconstruction
      - multiple_options_with_only_position_color_spacing_or_minor_component_variation
    component_valid:
      must_have:
      - nearest_component_family
      - instance_or_variant_strategy
      - slot_or_resizing_risk_check
      must_not:
      - detached_or_parallel_component_family_without_need
      - full_page_reconstruction_for_component_task
    readonly_valid:
      must_have:
      - write_allowed_false
      - evidence_status
  hard_fail:
  - no_valid_mode_before_write
  - source_like_reconstruction_without_verified_context_basis
  - neither_source_preserving_nor_materially_exploratory
  - multiple_options_with_no_material_difference
  - local_context_task_delivered_as_low_fidelity_reconstruction
  - component_task_rebuilds_full_page_context
  - source_context_reconstruction_hard_fail
context_integrity_gate_check:
  required_when:
  - figma_write
  - existing_context_local_mutation
  - local_interaction_modification
  - local_state_change_on_existing_context
  - multi_option_generation_inside_existing_context
  - continuation_iteration_inside_existing_context
  source:
  - references/metadata/task-routes.yaml > global_defaults.context_integrity_gate
  - references/figma-workflow.md > Existing Context Local Mutation Flow
  principle: select context strategy from task-routes.yaml#global_defaults.context_strategy_routing; every
    existing-context strategy preserves source evidence and locked-region appearance
  required_records:
  - context_basis
  - context_strategy
  - target_region
  - locked_context
  - new_local_element_scope
  allowed_context_basis:
  - locked_source_screenshot
  - previous_output_screenshot
  - component_family_canvas
  - direct_native_output
  pass_conditions:
  - context_basis is recorded before any Figma write
  - locked_source_screenshot is allowed only for the draft strategies defined in context_strategy_routing
  - previous_output_screenshot is allowed only when context_strategy is screenshot_overlay or source_locked_visual_draft
  - direct_native_construction uses direct_native_output
  - local one-off nodes are limited to the requested new element or state
  - existing locked regions are preserved by the selected strategy; native production uses verified source
    components and screenshot comparison without a screenshot background
  - component_family_canvas is used only for component or variant work, not for full-page context
  blocking_failures:
  - context_basis_missing_before_write
  - draft_blocked_context_unavailable
  - source_context_reconstruction_hard_fail
  - source_context_reconstruction_from_primitives
  - unverified_source_context_reconstruction_from_component_stack
  - source_context_reconstruction_from_screenshot_tracing
  - local_one_off_overlay_used_for_existing_context
  - locked_screenshot_traced_into_text_rectangles_or_vectors
  - screenshot_overlay_used_for_structural_mutation
context_strategy_check:
  required_before_figma_write: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.context_strategy_routing
  valid_values:
  - screenshot_overlay
  - direct_native_construction
  - source_locked_visual_draft
  direct_native_construction_required_when:
  - a new page requires production-ready editable output
  - productionization or componentization requires fully editable native layers
  screenshot_allowed_when:
  - fast direction draft adds only an independent topmost overlay or decoration
  - existing layout tree remains untouched
  - output is labeled exploration_draft and must_not_ship_as_production
  source_locked_visual_draft_allowed_when:
  - a visible draft or multiple options are requested on an existing source context
  - production-ready native editability is not required
  - source Frame and target_region are resolved before construction
  blocking_failures:
  - screenshot_overlay_used_for_structural_mutation
  - screenshot_draft_used_as_production_base
  - context_strategy_missing_before_write
persistent_write_scope_check:
  required_after_every_persistent_figma_write: true
  enforcement_timing: inside the same atomic use_figma call before return
  source:
  - references/metadata/task-routes.yaml > global_defaults.persistent_write_scope
  target_file_key_ref: references/metadata/task-routes.yaml#global_defaults.source_figma_file_key
  default_target_page_id_ref: references/metadata/task-routes.yaml#global_defaults.output_page_id
  required_records:
  - created_node_ids
  - mutated_node_ids
  - removed_node_ids_when_any
  - persistent_node_page_map
  - write_scope_mode
  - unrelated_official_source_nodes_unchanged
  pass_conditions:
  - ordinary tasks only create or mutate the canonical output Page itself or its descendants
  - explicit formal component maintenance only creates or mutates nodes within its recorded exact page and
    source-frame allowlist
  - explicit scene index maintenance only creates or mutates nodes on the registered index Page or its descendants
  - no unrelated official source product component token icon asset or reference node appears in mutated_node_ids
  - every temporary node is removed and reported separately
  - returned node IDs cover every persistent mutation made by the operation
  - a scope violation throws before return and atomically rolls back the entire operation
  blocking_failures:
  - persistent_write_scope_violation
  - created_or_mutated_node_outside_active_write_scope
  - unauthorized_official_source_node_in_mutated_node_ids
  - unreported_persistent_mutation
  - temporary_node_left_behind
task_atomic_output_check:
  required_when:
  - ordinary_generated_output_or_output_page_audit_preview
  source:
  - references/metadata/task-routes.yaml > global_defaults.task_atomic_output
  required_records:
  - task_id
  - task_container_id
  - output_page_id
  - created_node_ids
  - mutated_node_ids
  - placement_origin
  - top_level_canvas_collision_check
  pass_conditions:
  - one task_id maps to one task container
  - the latest output Page children are read inside the write call
  - task container option creation placement and collision recheck complete in one use_figma call
  - every created and mutated node belongs to the active task container or the recorded date divider
  - retry with the same task_id returns the matching completed container only when request and screenshot evidence
    match
  blocking_failures:
  - task_container_identity_mismatch
  - task_write_split_across_multiple_mutating_calls
  - placement_state_read_before_the_atomic_write_call
  - created_or_mutated_node_outside_active_task_scope
  - concurrent_task_container_collision
source_locked_visual_draft_check:
  required_when: context_strategy_is_source_locked_visual_draft
  purpose: guarantee a visible output-only result with locked source context and editable target-region layers
  required_records:
  - source_frame_id
  - source_screenshot_evidence
  - target_region
  - locked_regions
  - requested_option_count
  - generated_option_count
  - generated_output_screenshot_count
  - official_source_unchanged
  - registered_component_family_gate_check_passed
  - production_gaps
  pass_conditions:
  - the task modifies an existing context or requests multiple options on an existing context
  - exact source Frame and target_region were resolved before construction
  - source screenshot is the locked full-frame background of each output-only proposal
  - only target_region is covered and rebuilt as editable native layers
  - every region outside target_region remains visually identical to the source screenshot
  - generated_option_count equals requested_option_count
  - every option has a full-frame screenshot and an actual Figma output node
  - official source nodes remain unchanged
  - registered component families inside target_region pass registered_component_family_gate_check
  - output is labelled source_locked_visual_draft exploration_draft and must_not_ship_as_production
  blocking_failures:
  - source_locked_output_claimed_as_fully_native_full_page_output
  - source_frame_or_target_region_unresolved
  - region_outside_target_region_reconstructed_or_changed
  - requested_option_count_not_delivered
  - generated_option_missing_node_or_screenshot
  - official_source_changed
  - registered_component_family_gate_failed
component_draft_isolation_check:
  required_for:
  - component_or_variant_design
  - componentization
  - reusable_component_or_variant_change
  source:
  - references/metadata/task-routes.yaml > global_defaults.component_draft_policy
  - references/metadata/source-registry.yaml > output_only_pages
  required_records:
  - component_output_kind
  - output_page_id
  - source_component_family_unchanged
  - output_component_authority
  - publishing_status
  pass_conditions:
  - output is nested inside the current task Frame under the task_date divider on the canonical output Page
  - non-component tasks use frame_structure_proposal rather than real Component nodes
  - real Component or ComponentSet nodes exist only after explicit componentization intent
  - real output components use Draft naming and shared authority output_only
  - formal source component pages and families remain unchanged unless formal_component_maintenance_check passes
  - output components are excluded from future source and ready_to_force resolution
  - publishing_status is forbidden
  blocking_failures:
  - formal_source_component_family_mutated_without_maintenance_authorization
  - component_created_outside_active_write_scope
  - real_component_created_without_explicit_componentization
  - output_component_used_as_source_authority
  - component_published_automatically
formal_component_maintenance_check:
  required_when: user_explicitly_requests_formal_component_library_maintenance_or_promotion
  source:
  - references/metadata/task-routes.yaml > global_defaults.component_draft_policy.formal_promotion_policy
  required_records:
  - authorized_formal_page_ids
  - authorized_source_frame_ids
  - nearest_component_family
  - component_name_and_category
  - property_and_slot_contract
  - resizing_test
  - source_instance_replacement_scope
  - before_after_screenshot_check
  - metadata_updates
  pass_conditions:
  - authorization uses exact Page and Frame IDs rather than an entire file wildcard
  - new modules extend the nearest family or document why a new family is necessary
  - component names categories properties slots and resizing behavior are stable
  - only explicitly authorized source modules are replaced by promoted instances
  - unrelated source content and sibling components remain unchanged
  - output Page contains an audit preview when visual comparison is needed
  - publishing remains a manual action
  blocking_failures:
  - formal_maintenance_intent_missing
  - formal_maintenance_scope_not_exact
  - unrelated_formal_component_or_source_node_mutated
  - parallel_component_family_created_without_reason
  - resizing_or_instance_replacement_not_validated
  - component_published_automatically
top_level_canvas_collision_check:
  required_when: output_page_top_level_frame_write
  source:
  - references/metadata/task-routes.yaml > global_defaults.canvas_placement_policy
  target_page_id_ref: references/metadata/task-routes.yaml#global_defaults.output_page_id
  required_records:
  - task_date
  - date_divider_id
  - date_divider_created_or_reused
  - placement_batch_frame_ids
  - placement_origin
  - top_level_bounds_checked
  - collision_pairs
  pass_conditions:
  - exactly one date divider resolves for task_date after the current atomic write
  - every new task Frame is grouped below the matching task_date divider
  - output Frame names omit date prefixes
  - the first task of a new day starts below the divider and later same-day tasks append below the current
    day maximum bottom plus 240
  - options in the same task row use actual frame widths plus 120 horizontal gap
  - no new top-level frame intersects another top-level scene node
  - existing frames are not moved automatically
  - no outer Section or wrapper Frame is created
  blocking_failures:
  - output_page_mismatch
  - new_page_created_for_task
  - task_date_missing_or_wrong_timezone
  - date_divider_missing_for_task_date
  - duplicate_date_divider_left_by_current_operation
  - output_frame_name_contains_date_prefix
  - task_frame_not_grouped_under_task_date_divider
  - top_level_frames_overlap
  - placement_not_rechecked_after_collision_resolution
  growth_warning:
    thresholds:
      top_level_node_count: 80
      max_bottom: 100000
    status: output_page_growth_warning
    behavior: warning only; keep current placement and never auto-delete move archive create Page or create
      Section
minimum_token_binding_check:
  required_when:
  - quality_tier_is_production
  - formal_component_maintenance
  inspect_and_report_when:
  - inspiration_draft
  - precision_draft
  source:
  - references/metadata/task-routes.yaml > global_defaults.minimum_token_binding
  principle: this is the authoritative applicability and enforcement policy for token and style binding;
    production_gaps_check defines allowable gap categories and their tier outcome
  dependency_verification:
    required_before_write: resolve and verify the required source variables and styles for the touched region
    unavailable:
      outcome: block_dependent_write
      failed_gate: design_system_unavailable
      reason: required source definitions cannot be found or verified; do not invent replacement design-system facts
    binding_incomplete_behavior: when source definitions are verified but eligible new or modified nodes remain
      unbound or the binding API cannot apply them, use enforcement_by_quality_tier
    component_policy_ref: references/metadata/validation.yaml#registered_component_family_gate_check
  enforcement_by_quality_tier:
    inspiration_draft:
      outcome: record_production_gap
    precision_draft:
      outcome: record_production_gap
    production:
      outcome: block_unresolved_core_binding
      failed_gate: token_binding_unavailable
  formal_component_maintenance:
    outcome: block_unresolved_core_binding
    failed_gate: token_binding_unavailable
  gap_policy_ref: references/metadata/validation.yaml#production_gaps_check
  gap_mapping:
    variable_binding: token_binding_incomplete
    style_binding: style_binding_incomplete
  required_records:
  - minimum_token_binding_plan
  - minimum_token_binding_result
  - new_local_element_scope
  core_properties:
  - fill
  - stroke
  - text_fill
  - radius
  - key_spacing_or_size_when_tokenized
  - opacity_when_semantic
  - text_style_when_available
  pass_conditions:
  - visible new local nodes bind core fills to semantic variables or use component instances/variants that
    already carry bindings
  - visible new text binds text fill to semantic variables and applies text style when available
  - visible new strokes and dividers bind line variables when used
  - visible new radii use bound radius variables where supported or report a non-core binding_gap with node
    id and property
  - new or modified text uses the MCP default text engine and preserves the intended size line height color
    hierarchy and alignment
  - unresolved bindings follow enforcement_by_quality_tier and the formal_component_maintenance override
  - draft gaps never excuse unreadable text locked-context changes or registered component substitution
  allowed_degraded:
  - binding_gap_for_non_core_local_attributes_with_node_id_property_and_reason
  raw_visual_sketch_escape_hatch:
    allowed_only_when:
    - user_explicitly_says_rough_sketch_or_ignore_specs_or_position_only
    required_labels:
    - raw_visual_sketch
    - must_not_ship_as_production
    still_required:
    - context_integrity_gate_check
    - screenshot_check
  blocking_failures:
  - production_new_visible_ui_has_raw_core_fill_without_binding
  - production_new_visible_ui_has_raw_core_text_fill_without_binding
  - production_new_visible_ui_has_raw_core_stroke_without_binding
  - production_radius_value_visually_matches_token_but_is_not_bound_or_reported_as_binding_gap
  - reports_production_ready_with_minimum_token_binding_only
mcp_default_text_runtime_check:
  required_when:
  - existing generated text characters change
  - a new Text node is created
  policy_ref: references/metadata/tokens.yaml#typography.runtime_text_policy
  principle: create or modify text through the MCP default text engine.
  pass_conditions:
  - untouched official source text remains unchanged
  - new or modified text uses the MCP default text engine
  - size line height color hierarchy and alignment follow the target visual role
canonical_node_reference_check:
  required: true
  policy_ref: references/metadata/task-routes.yaml#global_defaults.canonical_reference_policy
  inspect:
  - active route source_refs
  - validation source_refs
  - narrative markdown outside source-index.md
  - canonical stale and exclusion registries
  pass_conditions:
  - active routes use only source_frames.use_for source_registry.use_for or components logical references
  - every logical reference resolves to at least one canonical metadata record before live health check
  - concrete node IDs in narrative markdown appear only in source-index.md or an explicitly labeled stale or
    historical section
  - stale missing and excluded nodes never resolve as an active primary source
  warning_conditions:
  - live source scan finds a relevant node not yet represented by a canonical record or explicit exclusion
  warning_status: unindexed_live_node_candidate
  blocking_failures:
  - active_route_contains_concrete_node_id
  - active_validation_source_contains_concrete_node_id
  - logical_source_ref_does_not_resolve
  - stale_missing_or_excluded_node_resolves_as_active_primary
metadata_authority_gate_check:
  required: true
  source:
  - references/metadata/validation.yaml > metadata_authority_gate_check
  - references/metadata/task-routes.yaml > global_defaults.metadata_authority_gate
  principle: No metadata authority loaded, no Figma write
  required_records:
  - metadata_loaded
  reporting:
    format: compact_list
    examples:
    - 'metadata_loaded: task-routes, validation'
    - 'metadata_loaded: task-routes, validation, source-registry, source-frames'
    avoid:
    - verbose per-file explanations unless blocked or degraded
  runtime_section_loading:
    allowed: true
    command: python3 scripts/read_metadata_section.py
    rule: loading the exact named section from an authority YAML satisfies that authority requirement; compiled
      JSON alone does not satisfy write-route authority
  readonly_runtime_authority:
    allowed: true
    applies_to:
    - lookup_profile
    required:
    - runtime execution profile source digest matches current task-routes.yaml
    - lookup runtime index source digests match current source-frames source-registry components and visual-cache
      YAML
    - no Figma or Skill write is attempted
    - lookup runtime scene-index digest matches current scene-index.yaml
    record_as: metadata_loaded_runtime_digest_verified
  minimum_metadata:
    all_routes:
    - references/metadata/task-routes.yaml
    write_routes:
    - references/metadata/task-routes.yaml
    - references/metadata/validation.yaml
    component_or_variant_tasks:
    - references/metadata/components.yaml
    token_variable_or_style_tasks:
    - references/metadata/tokens.yaml
    source_node_tasks:
    - references/metadata/source-registry.yaml
    local_visual_cache_lookup:
    - references/metadata/visual-cache.yaml
  allowed_degraded_lookup:
    when_metadata_missing:
    - task_route_type_is_lookup
    - no_figma_write
    - evidence_status_is_source_index_only
    - confidence_is_low
  blocking_failures:
  - figma_write_attempted_without_task_routes_yaml_loaded
  - figma_write_attempted_without_validation_yaml_loaded
  - component_write_without_components_yaml_loaded
  - token_or_style_write_without_tokens_yaml_loaded
  - claims_full_validation_with_missing_metadata
  required_status_when_blocked:
  - metadata_unavailable
fast_path_check:
  required: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.execution_layers
  - references/metadata/task-routes.yaml > global_defaults.execution_layers
  principle: fast path is readonly only
  readonly_fast_path:
    applies_to:
    - existing_source_or_state_lookup
    - project_asset_lookup
    allowed:
    - source_registry_lookup
    - live_figma_source_read
    - component_library_read
    - sol_existing_output_read
    - screenshot_read_or_return
    blocking_failures:
    - persistent_write_figma
    - create_new_frame
    - leave_render_or_preview_frame
    - generate_missing_state
    - present_imagined_preview_as_existing_source
speed_tier_check:
  required: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.speed_tier_routing
  - references/metadata/task-routes.yaml > global_defaults.speed_tier_routing
  principle: choose the lightest workflow that answers the user's current decision
  required_records:
  - speed_tier_decision
  valid_tiers:
  - lookup_fast_path
  - fast_visual_exploration
  - continuation_iteration
  - productionization
  pass_conditions:
  - lookup requests stay read-only and skip generation references and production gates
  - first-round multi-option visual direction may use fast_visual_exploration with exploration_draft label
  - same-thread refinements check previous_output_context before source or library scans
  - productionization is reserved for selected directions or explicit production language
  - ordinary design or generation without production language may deliver a first visible exploration draft
    before full productionization
  blocking_failures:
  - lookup_task_runs_full_generation_flow
  - same_thread_refinement_restarts_full_preflight_without_new_dependency
  - fast_visual_exploration_claims_production_ready
  - production_request_delivered_only_as_screenshot_draft
  - first_stage_draft_claimed_as_production_ready
runtime_index_check:
  required: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.runtime_indexing
  pass_conditions:
  - lookup-index.json and execution-index.json match current authority source digests
  - ordinary lookup consumes only matched records rather than injecting either complete index
  - write routes load the smallest required authority YAML sections before writing Figma
  - stale runtime indexes are deterministically rebuilt or authority sections are used as fallback
  blocking_failures:
  - compiled_index_treated_as_authority
  - stale_runtime_index_used_without_rebuild_or_authority_fallback
  - complete_large_authority_files_loaded_for_exact_cached_lookup
fast_visual_exploration_check:
  required_for:
  - fast_visual_exploration
  source:
  - references/metadata/task-routes.yaml > global_defaults.speed_tier_routing.tiers.fast_visual_exploration
  - references/figma-workflow.md > New Context And Exploration
  principle: first show visual directions quickly, then productionize after selection
  required_records:
  - route_decision
  - speed_tier_decision
  - nearest_source_or_previous_output_context
  - context_basis
  - target_region
  - locked_context
  - new_local_element_scope
  - quality_tier
  - design_thesis
  - basic_visual_gate
  - production_gaps
  - exploration_draft
  - screenshot_check
  allowed:
  - locked_source_screenshot_background_when_source_duplication_is_blocked_or_unnecessary_for_direction_review
  - previous_output_screenshot_background_when_continuing_a_valid_draft
  - local_one_off_overlay_concepts_for_requested_new_element_only
  - touched_component_or_icon_family_only
  - preferred_token_binding_for_new_visible_ui
  forbidden:
  - production_ready_claim
  - full_design_system_gate_for_untouched_regions
  - delaying_first_round_visual_options_on_full_token_binding_audit
  - rebuild_existing_context_from_primitives
  - rebuild_existing_context_from_component_stack
  - trace_source_screenshot_into_local_text_rectangles_or_vectors
  - use_local_one_off_overlay_for_existing_page_skeleton_navigation_cards_lists_or_bottom_bar
  - skip_universal_basic_visual_check
  required_label_when_degraded:
  - must_not_ship_as_production
continuation_iteration_check:
  required_for:
  - continuation_iteration
  - continuation_profile
  source:
  - references/metadata/task-routes.yaml > global_defaults.speed_tier_routing.tiers.continuation_iteration
  - references/figma-workflow.md > Continuation Iteration
  principle: same-thread refinements reuse previous outputs before re-running source and library discovery
  required_records:
  - previous_output_context
  - target_nodes_or_assets_to_reuse
  - requested_delta
  - screenshot_check
  pass_conditions:
  - previous output node IDs or asset IDs are inspected before new source export
  - unchanged component families do not trigger repeated component search
  - prior options are duplicated or mutated instead of recreated from scratch
  blocking_failures:
  - previous_output_context_available_but_ignored
  - full_preflight_rerun_without_new_dependency
  - source_screenshot_reexported_when_existing_asset_is_valid
lookup_evidence_check:
  required_for:
  - existing_source_or_state_lookup
  - project_asset_lookup
  source:
  - references/metadata/task-routes.yaml > global_defaults.execution_layers.l1_lookup_readonly
  required_records:
  - evidence_status
  - source_nodes_checked
  allowed_evidence_status:
  - current_turn_reference_checked
  - local_cache_checked
  - source_index_only
  - figma_live_checked
  - screenshot_checked
  pass_conditions:
  - source_index_only result is described as provisional
  - not_found_in_source is only high-confidence when live Figma or screenshot evidence was checked
  blocking_failures:
  - source_index_only_claims_definitive_absence
  - no_evidence_status_reported
  - lookup_persists_figma_changes
visual_cache_lookup_check:
  required_when:
  - lookup_fast_path_reads_visual_cache
  - evidence_status_is_local_cache_checked
  - stale_cache_is_returned_as_historical_preview
  - explicit_visual_cache_refresh
  source:
  - references/metadata/visual-cache.yaml
  principle: local visual cache accelerates readonly preview only; live Figma remains authoritative for freshness,
    writes, components, variables, and productionization.
  required_records_when_cache_is_selected:
  - cache_id
  - source_node_id
  - render_state
  - appearance_mode
  - cache_status
  - cache_captured_at
  - evidence_status
  pass_conditions:
  - the request is resolved to a concrete screen_frame component component_set instance or module node before
    cache lookup
  - source_node_id and render_state exactly match the requested target and state
  - source_node_id and appearance_mode exactly match the resolved target and requested_appearance_mode
  - active unexpired cache may answer an ordinary readonly lookup
  - local_cache_checked evidence includes source_node_id and cache_captured_at
  - latest realtime current-version modification generation validation and productionization requests bypass
    cache authority and check live Figma
  - stale cache is labeled cache_stale and historical_preview_not_current_proof
  - mcp-unavailable fallback includes mcp_unavailable_degraded and does not claim latest or definitive absence
  - cache refresh occurs only after explicit refresh intent or a registered source-change maintenance event,
    and after successful live node screenshot and visual checks
  warning_first:
  - stale_cache_selected_with_required_timestamp_and_historical_status
  - active_cache_has_crossed_max_age_but_live_figma_is_temporarily_unavailable
  blocking_failures:
  - cache_used_before_concrete_node_resolution
  - cache_state_does_not_match_requested_render_state
  - cache_mode_does_not_match_requested_appearance_mode
  - cache_mode_is_unknown_or_unverified
  - cache_claims_latest_realtime_or_current_version
  - cache_used_as_source_frame_duplication_component_variable_or_productionization_evidence
  - cache_used_to_claim_definitive_not_found_in_source
  - active_cache_asset_path_missing_on_disk
  - ordinary_lookup_modifies_skill_cache_without_explicit_refresh_intent
  - cache_refresh_replaces_previous_asset_before_new_asset_and_metadata_validate
current_turn_gallery_reference_lookup_check:
  required_when:
  - lookup_fast_path_selects_an_uploaded_gallery_reference_preview
  principle: an uploaded preview selected from the Sol gallery is reusable current-turn evidence only when
    its explicit Figma identity and visual state match the resolved target.
  required_records:
  - provided_file_key
  - provided_node_id
  - resolved_file_key
  - resolved_node_id
  - requested_render_state
  - requested_appearance_mode
  - preview_file_validation_status
  pass_conditions:
  - provided_file_key equals resolved_file_key
  - provided_node_id equals resolved_node_id
  - the preview state and appearance mode exactly match the request
  - the uploaded preview exists is nonempty and has a recognized image signature
  - the user did not request latest realtime current version a different state or a different appearance mode
  - selected preview is persisted and delivered through visual_query_delivery_check without another Figma screenshot
  blocking_failures:
  - missing_or_mismatched_file_key_or_node_id
  - preview_state_or_mode_mismatch
  - latest_realtime_or_current_version_request_uses_reference_preview_as_authority
  - reference_preview_used_for_figma_write_component_variable_or_production_evidence
local_light_mutation_gate_check:
  required_for:
  - existing_context_local_mutation
  source:
  - references/metadata/task-routes.yaml > global_defaults.execution_layers
  - references/metadata/task-routes.yaml > global_defaults.execution_layers.l2_local_light_mutation
  principle: any Figma write is at least L2
  always_required:
  - route_decision
  - source_frame_id
  - source_screenshot_evidence
  - task_id
  - task_container_id
  - target_region
  - locked_regions
  - mutation_scope_check
  - screenshot_visual_check
  design_system_gate_levels:
    text_style_gate:
      applies_when:
      - text_only_edit
      - no_component_structure_change
      required_checks:
      - source_screenshot_locked
      - task_atomic_output_check
      - target_text_role_size_line_height_weight_preserved
      - locked_regions_unchanged
      - screenshot_visual_check
    target_component_gate:
      applies_when:
      - icon_change
      - button_change
      - component_state_change
      - image_or_asset_replacement
      required_checks:
      - text_style_gate
      - touched_component_or_icon_family_verified
      - no_parallel_local_component_family
    full_design_system_gate:
      applies_when:
      - layout_change
      - overlay_or_sheet_or_popover_change
      - card_or_navigation_or_bottom_bar_change
      - reusable_component_or_variant_change
      required_checks:
      - figma_design_system_gate_check
      - component_instance_or_variant_check
      - token_and_style_binding_check
      - screenshot_visual_check
  blocking_failures:
  - starts_from_blank_canvas
  - skips_source_frame_duplication
  - changes_non_target_region
  - applies_text_style_gate_to_component_or_layout_change
  - skips_screenshot_visual_check
route_confidence_check:
  required: true
  confidence_values:
  - high
  - medium
  - low
  pass_conditions:
  - high confidence can continue with selected route
  - medium confidence is limited to read-only or conservative preflight with no Figma write
  - low confidence asks user before writing or generating
  fail_conditions:
  - medium_or_low_confidence_writes_figma
  - confidence_missing
  - keyword_match_overrides_clear_semantic_intent
route_rollback_check:
  required: true
  rollback_routes:
    generation_or_mutation_mistaken: existing_source_or_state_lookup
    exploration_mistaken: existing_context_local_mutation
    component_mistaken: source_component_family_lookup
  pass_conditions:
  - contradictory evidence triggers a more conservative route before writing
  - lookup wording discovered after preflight stops generation
  fail_conditions:
  - continues a write route after discovering the user only wanted lookup
  - treats failed lookup as permission to generate a new design
source_node_health_check:
  required_when:
  - source_node_used
  - source_registry_available
  source:
  - references/metadata/source-registry.yaml
  - references/metadata/source-frames.yaml
  - references/source-index.md
  pass_conditions:
  - node exists or stale status is reported
  - registered active nodes are used for product source lookup
  - screenshot, export, and duplication targets resolve to exportable screen_frame nodes
  - replacement candidates are checked when a node is stale or missing
  fail_conditions:
  - uses a source_group node directly for screenshot, png export, or source-frame duplication
  - uses an unregistered summary page as source
  - claims live verification when Figma MCP is unavailable
source_frame_index_health_check:
  required_when:
  - references/metadata/source-frames.yaml_loaded
  - screenshot_display
  - png_export
  - source_frame_duplication
  - local_mutation_profile
  source:
  - references/metadata/source-frames.yaml > maintenance
  principle: source-frames.yaml is a cached frame-resolution index; live Figma metadata is preferred when available.
  required_checks:
  - source_group_resolved_to_exportable_screen_frame
  - selected_screen_frame_node_exists_or_stale_reported
  - selected_screen_frame_name_or_size_matches_live_metadata_when_available
  - official_source_pages_are_read_only_by_default_and_any_formal_component_maintenance_uses_exact_allowlist
  warning_first:
  - cached_frame_name_differs_from_live_name
  - cached_frame_size_differs_from_live_size_but_visual_target_is_clear
  - alias_missing_for_user_wording_but_visual_candidate_found
  - non_primary_frame_entry_missing_last_verification
  blocking_failures:
  - source_group_used_as_export_or_duplication_target
  - live_figma_confirms_selected_screen_frame_missing
  - wrong_product_area_selected_after_live_metadata_check
  - source_frame_index_stale_but_result_claims_full_validation
  stale_result_status:
  - source_frame_index_stale
  - use_live_figma_metadata_conservatively
  - do_not_claim_full_validation_until_rechecked
platform_display_node_resolution_check:
  required_when:
  - resolving_visible_screen_evidence
  - resolving_screenshot_or_export_target
  - source_node_will_be_used_by_another_execution_layer
  source:
  - references/metadata/source-frames.yaml > platform_display_contract
  principle: design evidence must resolve to a concrete exportable screen_frame, not a canvas, source_group,
    page name, or ambiguous semantic label; the Agent resolves it and the platform only transports and presents
    the Agent result.
  required_fields:
  - file_key
  - node_id
  - node_role
  - exportable
  - evidence_status
  pass_conditions:
  - node_role is screen_frame
  - exportable is true
  - source_group_id when present is context only, not the display target
  - evidence_status distinguishes figma_live_checked from local_cache_checked and source_index_only
  - stale or missing nodes are listed only as fallback candidates
  warning_first:
  - source_index_only_result_without_live_metadata
  - live_name_changed_but_node_exists_and_size_matches
  blocking_failures:
  - returns_source_group_as_display_node
  - returns_page_or_canvas_name_without_screen_frame
  - returns_stale_or_missing_node_as_primary
  - omits_node_id_for_display_evidence
  - claims_live_verified_without_live_figma_check
divergence_contract_check:
  required_when:
  - exploration_profile
  - exploration_mode
  required_fields:
  - what_changes
  - what_stays_locked
  - why_this_is_materially_distinct
  - visual_difference_evidence
  fail_conditions:
  - color_only_change
  - spacing_only_change
  - grid_only_change
  - shadow_only_change
  - near_same_card_shape_relabelled_as_visual_organization
page_experience_profile_check:
  authority: references/screen-patterns.md
  mapping_authority: references/metadata/source-frames.yaml
  required_when:
  - new_module_insertion
  - page_structure_change
  - new_page_state
  - page_generation
  - explicit_redesign_or_exploration
  - component_validation_in_real_page_context
  skip_when:
  - existing_source_or_state_lookup
  - pure_copy_change
  - pure_icon_replacement
  - pure_token_or_component_lookup
  required_internal_evidence:
  - experience_profile_loaded
  - extension_heuristic_used
  pass_conditions:
  - active exportable source frame resolves to experience_profile and state_role
  - only the matching profile_id section and an optional context profile are loaded
  - design_check.locked_context inherits the profile Must Keep rules
  - design_check.main_visual_change matches Can Vary or Extension Heuristics
  - state work changes only the documented delta and preserves the page family
  - screenshot evidence checks primary focus, focus curve, surface grammar, and module placement
  warning_first:
  - extension heuristic is weakly reflected but no protected source region or primary task is harmed
  - new exploration context uses the nearest confirmed profile and reports page_experience_gap
  - profile mapping metadata is incomplete for a non-production candidate
  blocking_failures:
  - known active page structural or visual generation starts without loading its profile
  - output violates Must Keep and changes the primary task or protected source shell
  - a state delta is implemented by rebuilding or restyling the full page
  - production output claims profile coverage from a provisional or missing profile
  new_context_policy:
    exploration: nearest confirmed profile plus page_experience_gap is allowed as a labelled draft
    production: profile must be confirmed before claiming production coverage
  provisional_policy: exploration_reference_only
gate_level_check:
  required: true
  levels_ref: task-routes.yaml#gate_levels
  scope_policy_ref: task-routes.yaml#global_defaults.persistent_write_scope
validator_severity:
  rollout_strategy: warning_first_for_non_core_rules
  blocking_now:
  - lookup_task_attempts_to_write
  - local_mutation_without_source_locked_context
  - registered_component_family_gate_failed
  - required_instance_or_source_extension_unresolved
  - registered_component_replaced_by_local_primitives
  - source_context_rebuilt_outside_target_region
  - persistent_write_scope_violation
  - formal_source_component_family_mutated_without_authorization
  - ready_to_force_component_detached_in_final_output
  - locked_region_changed
  - source_background_changed_or_recreated
  - universal_basic_visual_gate_failed
  - task_atomic_output_check_failed
  - screenshot_overlay_used_for_structural_mutation
  - source_product_or_component_page_modified_without_authorization
  - top_level_frames_overlap
  - known_active_page_profile_not_loaded_for_structural_or_visual_generation
  - profile_must_keep_violation_changes_primary_task_or_source_shell
  - state_delta_rebuilds_full_page
  warning_first:
  - non_core_variable_not_bound
  - metadata_field_incomplete
  - naming_inconsistency
  - screenshot_missing_zoom_crop_for_dense_region
  - exploration_difference_weak_but_not_production
  - page_experience_heuristic_weak_but_context_preserved
  promote_warning_to_blocking_when:
  - repeated_in_same_route
  - caused_visible_user_facing_defect
  - prevents_component_reuse_or_source_protection
figma_design_judgment_check:
  required: when_writing_or_exploring
  source:
  - references/design-language.md
  - references/design-quality.md
  - matching profile_id section from references/screen-patterns.md when page_experience_profile_check is required
  must_record_before_write:
  - design_check
  design_check_fields:
  - user_goal
  - locked_context
  - main_visual_change
  - risk
  - visual_evidence
  must_record_after_screenshot:
  - self_critique_result
  pass_conditions:
  - user_goal is one clear user task or decision
  - locked_context states which source regions must remain unchanged
  - main_visual_change is visible in the screenshot
  - risk names the most likely failure mode for this route
  - visual_evidence says what screenshot region proves the result
  fail_conditions:
  - writes Figma before route-required design_check is recorded
  - records vague evidence such as make it nicer modern style
  - uses design_check to justify changes outside locked context
  - creates artifacts outside the canonical fixed output Page without explicit authorization
  - self critique cannot connect to screenshot evidence
external_reference_check:
  required_when:
  - local_component_state_missing_but_parent_component_exists
  - user_provides_reference_screenshot
  - user_requests_mature_product_reference
  - user_requests_better_visual_quality_without_existing_source_pattern
  source:
  - references/external-reference-patterns.md
  - references/design-quality.md
  - references/feature-insertion.md
  source_priority:
  - user_provided_screenshots
  - closest_shaonian_bowen_source_component_or_screen
  - mature_external_products
  breadth_control:
    products_per_task: up_to_3_relevant_products_unless_deeper_research_is_explicitly_requested
    categories_per_task: only_task_relevant_categories
    pattern_takeaways: 1_to_3
  skip_when:
  - readonly_lookup_without_reference_request
  - ordinary_precision_draft_with_sufficient_local_pattern
  required_records:
  - external_reference_used
  - reference_evidence_level
  - reference_visual_sources_when_visual_reference_checked
  - reference_categories_checked
  - reference_products_checked
  - pattern_takeaways
  - shaonian_bowen_translation
  - not_copied
  pass_conditions:
  - references are used for affordance hierarchy placement density or state expression
  - final output uses Shaonian Bowen parent component variables styles icons spacing and tone
  - design_quality_audit confirms the result still feels like Shaonian Bowen
  - pattern_memory_reference is used when only skill product knowledge or written patterns were consulted
  - visual_reference_checked is used only after inspecting a user screenshot live page or external-library
    image
  - no reference use is recorded as none
  fail_conditions:
  - external reference replaces a missing ready_to_force component
  - output copies external product chrome navigation icon style color system or entertainment tone
  - too many unrelated references create mixed visual language
  - no Shaonian Bowen translation is recorded before writing
  - claims a named product latest or current design was checked without a visual source
  - declares visual_reference_checked from a product name or memory alone
  evidence_source_types:
    visual_reference_checked:
    - user_screenshot
    - live_page
    - library_image
    pattern_memory_reference:
    - skill_pattern
    - product_memory
    - written_pattern
preflight_contract:
  required: true
  source:
  - references/metadata/task-routes.yaml
  must_record_before_write:
  - route_decision
  - quality_tier
  - route_profile_required_fields
  - turn_intent_contract
  - mode_validity
  fail_condition:
  - starts writing Figma before preflight is complete
  - route_decision is missing before selecting workflow
  - confidence medium or low writes Figma
  - lookup wording is routed to mutation or exploration without explicit generation wording
  - no_valid_mode_before_write
  - neither_source_preserving_nor_materially_exploratory
  - existing context local mutation starts before source-locked visual context and task identity are recorded
  - route profile minimum fields are missing
  - turn_intent_contract missing before Figma write or multi-option generation
  - starts writing before the universal basic visual QA plan and quality-tier-specific gates are selected
figma_design_system_gate_check:
  required_when:
  - quality_tier_is_production
  - formal_component_maintenance
  inspect_and_report_when:
  - inspiration_draft
  - precision_draft
  source:
  - references/figma-workflow.md
  target_policy_ref: references/metadata/task-routes.yaml#global_defaults
  binding_policy_ref: references/metadata/validation.yaml#minimum_token_binding_check
  must_do_before_write:
  - verify required local components variables text styles and effect styles in the same file
  - verify each indexed component locator live type and resolve a concrete local COMPONENT or variant child
    when the locator is a catalog Frame
  - create or modify text through the MCP default text engine
  - resolve every ready_to_force component by local node_id and smoke test local instance creation
  - reject any non-local component resolution secondary destination or destination switching
  - record design_system_gate_result
  fail_condition:
  - required ready_to_force component cannot be found or instanced
  - catalog Frame or Section is treated as an instanceable component
  - required source variable or style definitions cannot be found or verified under minimum_token_binding_check
  - binding completion fails the applicable tier or formal-maintenance outcome in minimum_token_binding_check
  - text mutation changes official source text or any locked region structure
  - local primitive is used as fallback for a missing ready_to_force component
  failed_gate_values:
  - design_system_unavailable
  - required_component_unavailable
  - token_binding_unavailable
  - primitive_substitution_hard_fail
  report_gap_values: []
  draft_report_gap_values_ref: references/metadata/validation.yaml#production_gaps_check.allowed_values
output_file_policy_check:
  required: true
  source:
  - references/metadata/task-routes.yaml > global_defaults.persistent_write_scope
  - references/figma-workflow.md > Before Write
  default_policy: native_source_file_fixed_output_page
  target_policy_ref: references/metadata/task-routes.yaml#global_defaults
  source_product_and_component_pages: read_only_except_explicit_formal_component_maintenance
  scene_index_page: read_only_except_explicit_scene_index_maintenance
  pass_conditions:
  - generated screens are date-grouped top-level task Frames directly on the canonical fixed output Page
  - exactly one date divider exists for the current task_date and each current task Frame is placed below it
  - task Frame names omit date prefixes; the date appears only in the date divider
  - official source product and component pages remain unchanged unless exact formal component maintenance
    authorization applies
  - the scene index Page remains unchanged unless explicit scene index maintenance authorization applies
  - no new Page Section or wrapper is created per task
  - execution evidence records output_file_policy target_file_key output_page_id output_frame_name task_date
    and date_divider_id
  - persistent_write_scope_check passes for every write operation
  - component drafts remain output_only; promoted formal components pass formal_component_maintenance_check
  fail_conditions:
  - creates a new Figma file under this fixed-output workflow
  - attempts any non-local operation secondary destination or destination switching
  - creates a new Page Section or wrapper for a task
  - leaves a duplicate divider for the current task_date
  - creates a task Frame with a date prefix
  - places a task Frame outside the matching day section
  - writes outside the canonical fixed output Page without exact formal component or scene index maintenance
    authorization
  - mutates an unauthorized official source product component token or asset page
  - persistent created or mutated node resolves outside the active exact write scope
  - component task mutates a formal source component page without authorization or publishes automatically
source_or_state_lookup_readonly_check:
  required_for:
  - existing_source_or_state_lookup
  - source_lookup
  - state_lookup
  - component_lookup
  - project_asset_lookup
  source:
  - references/metadata/task-routes.yaml > routes
  - references/figma-workflow.md
  - references/source-index.md
  required_records:
  - task_route_type
  - semantic_intent
  - source_nodes_checked
  - screenshot_or_node_candidates
  - found_existing_state_or_not_found_in_source
  - whether_generation_was_explicitly_requested
  pass_conditions:
  - Figma lookup leaves no persistent edits or output frames
  - existing source/output candidates are returned when found
  - ordinary lookup outside variable_mode_visual_lookup reports not_found_in_source when no existing state
    is found
  - night or dark-mode lookup renders the same resolved target under the matching variable mode when available
    without persistent Render or preview frames
  - no generated preview is described as an existing design
  - local cache results disclose their source node and capture time and never claim live freshness
  fail_condition:
  - semantic lookup intent is routed to generation because exact keyword was absent
  - user asks to see inspect confirm locate or ask whether an existing state exists but task_route_type is
    not existing_source_or_state_lookup
  - persists Figma changes during a lookup request
  - creates a new frame or local preview for wording such as 长啥样 看一下 查询 有没有 without explicit generation verb
  - leaves Render dark preview or other persistent preview nodes in any Figma file after lookup
  - changes avatar mascot copy card text labels or layout while answering a lookup
  - returns an imagined night mode as if it were found in source
  - reports not_found_in_source for night or dark-mode lookup solely because no standalone dark frame exists
  - answers night or dark-mode lookup without checking variable collections or mode applicability when live
    Figma is available
  - reports a generated design without source_nodes_checked
variable_mode_visual_lookup_check:
  required_for:
  - variable_mode_visual_lookup
  - ordinary_visual_lookup
  - unspecified_mode_visual_lookup
  - night_mode_lookup
  - dark_mode_lookup
  source:
  - references/figma-workflow.md
  - references/metadata/task-routes.yaml > routes.existing_source_or_state_lookup.variable_mode_visual_lookup
  - references/source-index.md > Variables
  precedence: higher_than_parent_existing_state_fallback_and_generation_invitation
  required_records:
  - target_node_id
  - target_node_role
  - variable_collection_checked
  - requested_mode
  - requested_mode_source
  - actual_rendered_appearance_mode
  - appearance_mode_verification_status
  - original_explicit_variable_mode
  - render_evidence_status
  - restore_status
  - temporary_render_cleanup_status
  - chrome_component_integrity_status
  - cache_exact_match_status
  - live_render_required_status
  - variable_mode_completion_path
  pass_conditions:
  - an unspecified current-turn mode resolves to light_default before cache lookup or live rendering
  - explicit current-turn night or dark wording resolves to dark
  - requested target is resolved to a concrete node before mode rendering
  - matching variable collection and mode are checked before reporting availability
  - exact active unexpired same-node same-mode cache is the only cache completion path
  - cache absence expiry node mismatch or mode mismatch sets live_render_required_status to true
  - live_render_required_status triggers live Figma variable inspection and transient rendering on the same
    resolved target
  - the same resolved target is rendered under the requested variable mode without reconstructing page chrome
  - delivered visual has a verified actual_rendered_appearance_mode exactly equal to requested_mode
  - if live rendering is unavailable the selected cache is active unexpired and exactly matches source_node_id
    and requested_mode
  - original explicit variable mode is restored if the source node was touched
  - any temporary duplicate or render node is deleted before response
  - status bar navigation bar icon button and back control remain source/library instances or are reported
    as screenshot limitations
  - unavailable or degraded cases use the exact status from task-routes.yaml routes.existing_source_or_state_lookup.variable_mode_visual_lookup.fallback_status
    instead of not_found_in_source
  - variable-mode completion returns a visual or an exact variable-mode fallback status without a generation
    invitation
  fail_condition:
  - unspecified visual lookup inherits dark from the source node current variables a reference screenshot history
    or previous conversation
  - requested and actual rendered appearance modes differ
  - actual rendered appearance mode is unknown or unverified at delivery
  - mismatched-node mismatched-mode expired or unverified cache is delivered as the requested mode
  - explicit night or dark lookup enters the parent ordinary-state fallback
  - explicit night or dark lookup stops after finding only a light cache while live Figma is available
  - explicit night or dark lookup asks whether to generate a dark draft
  - treats a missing standalone dark frame as absence of night mode
  - leaves a source node in the requested variable mode after a lookup
  - invents dark colors or manually recolors nodes instead of using variable modes
  - creates persistent Render dark preview or local preview frame in any Figma file for a lookup request
  - hand redraws or substitutes status bar navigation bar back icon or icon button
  - changes source text content layout avatar or page modules while producing a variable-mode lookup preview
semantic_authority_ambiguity_check:
  required_when:
  - a term has both product or business meaning and Figma technical meaning
  - a count differs by authority scope
  - 页面 Page Canvas 状态 or 组件 can change the requested authority scope
  source:
  - references/metadata/task-routes.yaml > global_defaults.semantic_ambiguity_routing
  - references/metadata/source-frames.yaml when product display screens are requested
  required_records:
  - primary_scope
  - primary_authority
  - dynamic_calculation_or_lookup_evidence
  - alternate_scope_disclosure_when_materially_different
  - technical_page_inventory_when_figma_page_count_is_reported
  pass_conditions:
  - current product context is answered first unless the current turn explicitly requests the Figma technical
    scope
  - materially different technical scope is separately labeled instead of silently replacing the product scope
  - every count is derived from its current authority source at execution time
  - a reported Figma Page or Canvas count is backed by the target file Document root direct-child inventory
  - the technical page inventory lists every counted Page or Canvas node_id and name
  - the reported technical count equals the technical page inventory length
  fail_condition:
  - regression expected count is hardcoded into a rule script prompt or answer template
  - product display-screen question is silently answered with only Figma top-level Page or Canvas count
  - authority source changes without disclosure
  - platform computes the business count or chooses the authority scope
  - current Page selected node viewport or descendant subtree is treated as the full Figma file
  - a Figma Page or Canvas count is reported without an auditable Document-root page inventory
  - the reported Figma Page or Canvas count differs from the enumerated inventory length
generated_output_delivery_check:
  required_for:
  - every_figma_write_that_delivers_top_level_output_frames
  - multi_option_generation
  - base_page_plus_interaction_state_generation
  - continuation_or_annotation_turn_with_multiple_delivery_frames
