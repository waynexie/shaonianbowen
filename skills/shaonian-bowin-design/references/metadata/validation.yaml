  - overlap_check
  - width_behavior
  - arrow_attachment_check
  - overlay_layering_check
  - locked_regions_unchanged_check
  - fallback_when_not_enough_space
  - interaction_state_notes_when_interaction_requested
  type_rules:
    Definition Bubble:
      use_when:
