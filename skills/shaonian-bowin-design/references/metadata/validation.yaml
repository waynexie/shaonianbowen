  - delivery_frame_ids contains every unique top-level output Frame that constitutes the current-turn result
  - generated_figmas contains exactly one record per delivery_frame_id in intended visual order
  - every generated_figmas record includes file_key node_id name url image_url width and height
  - every image_url resolves to the validated full-frame screenshot of the same node_id
  - generated_figmas_count equals generated_output_screenshot_count and the unique delivery_frame_ids count
  - a singular compatibility field aliases only the first array item and never truncates the array
  blocking_failures:
