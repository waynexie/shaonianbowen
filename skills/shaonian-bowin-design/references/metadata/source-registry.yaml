node_health_check:
  required_before_use: true
  checks:
  - node_exists
  - node_name_matches_or_parent_context_matches
  - expected_page_matches
  - expected_size_matches_when_known
  - node_role_matches_intent
  - exportable_frame_resolved_for_screenshot_or_display
  - screenshot_or_metadata_available
  stale_behavior:
  - report_source_node_stale
  - do_not_use_as_primary_source
  - search_replacement_candidates
  mcp_unavailable_behavior:
    status: mcp_unavailable_degraded
    allowed: cached_index_or_asset_lookup_only
    forbidden:
    - claim_live_node_verified
    - claim_figma_write_completed
    - claim_screenshot_checked
node_role_resolution:
  rule: source_group nodes are for locating and scanning only; screenshot, export, display, and source-frame
    duplication must resolve to an exportable screen_frame child first.
  source_group:
    exportable: false
    allowed_for:
    - semantic_lookup_scope
    - child_frame_search
    - source_context_scan
    forbidden_for:
    - direct_png_export
    - direct_screenshot_display
    - direct_source_frame_duplication
  screen_frame:
    exportable: true
    allowed_for:
    - screenshot_display
    - png_export
    - source_frame_duplication
    - local_mutation_base
  fallback_order_for_group_lookup:
  - exact_alias_match
  - exact_child_name_match
  - primary_display_frame
  - first_exportable_390w_frame
