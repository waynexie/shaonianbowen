schema_version: 1
purpose: exportable product screen frame index for Shaonian Bowen source groups
source_file:
  file_key: oULxBlEvFNkWGGVaJ0ClEz
  file_name: 少年博闻 Component Architecture v2
  file_role: read_only_design_source
  naming_note: file_name is the authoritative Figma design file; ordinary output is restricted to the registered
    output-only page in task-routes.yaml.
  policy: read_only_by_default_with_explicit_formal_component_maintenance_exception
maintenance:
  index_type: cached_frame_resolution_index
  live_figma_metadata_preferred: true
  last_verified_at: '2026-10-29'
  verify_when:
  - source Figma page or frame is renamed
  - source Figma node is moved or replaced
  - frame size changes
  - a lookup returns no match but the user expects an existing screen
  - before promoting a source-frame mismatch from warning to blocking
  stale_policy:
  - do not treat cached aliases as proof that a live node still exists
  - prefer live Figma node metadata when available
  - if live metadata contradicts this index, report source_frame_index_stale and use live evidence conservatively
  - missing or stale non-critical frame entries start as warning, not blocking
  - screenshot, export, and duplication still require a live exportable screen_frame
  last_verified_scope:
  - 7323:2913
  - 4232:11310
usage_policy:
  load_when:
  - existing_source_or_state_lookup
  - screenshot_display
  - png_export
  - local_mutation_profile
  - source_frame_duplication
  do_not_load_for:
  - pure_component_lookup
  - pure_token_lookup
  - general_design_language_question
  rule: source_group nodes are not display/export targets; resolve to an exportable screen_frame before screenshot,
    export, or duplication.
  resolution_order:
  - exact_alias_match
  - exact_frame_name_match
  - primary_display_frame
  - first_exportable_390w_frame
platform_display_contract:
  purpose: resolve design evidence to a concrete displayable node instead of guessing from page or group names
  contract_scope: semantic_display_target_only
  semantic_resolution_owner: agent
  platform_role: unchanged_transport_and_display_only
  required_when:
  - returning a visible screen link
  - returning screenshot target
  - returning export target
  - returning local mutation base frame
  - handing source nodes to another agent or platform
  required_fields:
  - file_key
  - node_id
  - node_role
  - exportable
  - evidence_status
  optional_context_fields:
  - source_group_id
  - name
  - size
  valid_result:
    node_role: screen_frame
    exportable: true
    evidence_status_allowed:
    - local_cache_checked
    - figma_live_checked
    - screenshot_checked
    - source_index_only
  invalid_result:
  - source_group_only
  - missing_node_id
  - stale_or_missing_node_as_primary
  - canvas_or_page_name_without_screen_frame
  - source_index_only_claimed_as_live_verified
  - local_cache_checked_claimed_as_live_verified
  stale_node_policy:
  - stale nodes may be returned only under stale_or_fallback_candidates
  - stale nodes must include replacement_candidates when known
  - if no live screen_frame can be verified, return readonly_only with source_frame_index_stale
node_roles:
  source_group:
    exportable: false
    use_for:
    - semantic_lookup_scope
    - child_frame_search
    - source_context_scan
  screen_frame:
    exportable: true
    use_for:
    - screenshot_display
    - png_export
    - source_frame_duplication
    - local_mutation_base
experience_profile_contract:
  authority: references/screen-patterns.md
  required_for_active_exportable_frames:
  - experience_profile
  - state_role
  optional_context_field: context_experience_profile
  loading_rule: load only the matching profile_id section; when context_experience_profile exists, load it as the
    locked underlying page context.
  status_policy:
    confirmed: may guide production and exploration
    provisional: exploration reference only; not a production source
  maintenance_rule:
  - map a new frame to an existing profile when cognitive flow and surface grammar are unchanged
  - add only a new state_role for a state delta
  - create a new profile only after the page model is confirmed
