      - production language is explicit in the initial request
      - user explicitly asks for one-pass production-ready delivery
      must_not:
      - describe stage_1 as production ready
      - force an extra confirmation when the request already selects a direction or asks for production
      - weaken context integrity source protection or persistent write scope in stage_1
    default_rule: prefer lookup_fast_path for queries, fast_visual_exploration for first-visible-direction
      delivery when design intent is not yet production-specific, continuation_iteration for same-thread refinements,
      and productionization only after direction selection or explicit production language
