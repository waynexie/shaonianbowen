  runtime_indexing:
    purpose: answer routing and lookup requests from small compiled slices without loading the complete authority
      files into model context
    compiled_outputs:
      lookup_index: references/runtime/lookup-index.json
      execution_index: references/runtime/execution-index.json
    commands:
      lookup: python3 scripts/query_runtime_index.py
      execution_profile: python3 scripts/read_execution_profile.py
      authority_section: python3 scripts/read_metadata_section.py
      rebuild: python3 scripts/build_runtime_indexes.py
      verify: python3 scripts/build_runtime_indexes.py --check
      benchmark: python3 scripts/benchmark_runtime_indexes.py
    authority_policy:
    - compiled indexes are derived artifacts and never override metadata YAML
    - each compiled index stores source SHA-256 digests
    - query commands rebuild an index when its digest is stale
    - read_metadata_section output counts as loading the named authority section for metadata_authority_gate
    - a digest-verified runtime execution profile satisfies task-route authority for readonly lookup only
    - fall back to the smallest matching authority section when index generation or lookup fails
    context_budget:
      exact_cached_lookup_max_bytes: 10240
      rule: return only matched records and one selected execution profile; never inject the complete runtime
        index into model context
    forbidden:
    - treat_compiled_index_as_second_authority
    - read_complete_task_routes_or_validation_for_ordinary_lookup
    - read_complete_runtime_index_into_model_context
  speed_tier_routing:
    purpose: choose the lightest workflow that can answer the user's current decision without hiding production
      gaps
    tiers:
      lookup_fast_path:
        use_when:
        - user asks to see inspect locate compare or confirm existing source output component state asset or
          material
        default_route_profile: lookup_profile
        write_allowed: false
        read_policy_ref: route_profiles.lookup_profile
        read_rule: reuse an exact uploaded current-turn gallery reference first, otherwise query the compiled
          runtime index and return only matches; load the smallest authority section only on ambiguity, staleness,
          unsupported state or write transition
        figma_work:
        - resolve a concrete source node before checking local visual cache
        - when an uploaded current-turn gallery reference has the same file key node id state and appearance
          mode, persist and deliver that preview without another Figma call
        - return an exact active unexpired cache match for ordinary lookup
        - bypass cache for latest realtime state mismatch writes or productionization
        - take a live screenshot only when freshness or evidence requires it
        forbidden:
        - repeat Figma screenshot for an exact uploaded current-turn gallery reference without latest realtime
          state or mode requirements
        - full_design_system_gate
        - design_language_read
        - production_validation
        - new_frame_creation
      fast_visual_exploration:
        use_when:
        - user asks for 多方案 试几版 看效果 形式不限 发散 快速看看
        - user has not selected a direction for productionization
        - user asks to design or generate a new page state module or component without explicit production
          language and a first visible direction can answer the current decision
        default_route_profile: exploration_profile
        default_quality_tier: inspiration_draft
        write_allowed: true_with_draft_label
        output_label: exploration_draft
        required_reads:
        - selected route and execution profile from references/runtime/execution-index.json through python3
          scripts/read_execution_profile.py
        - only the matching authority sections required before Figma write through python3 scripts/read_metadata_section.py
        - target record from references/runtime/lookup-index.json through python3 scripts/query_runtime_index.py
        - nearest source screenshot or existing output context
        - only the component or icon family touched by the new local element
        required_before_write:
        - quality_tier_decision
        - context_strategy
        - context_basis
        - target_region
        - locked_context
        - new_local_element_scope
        - production_gap_plan
        allowed_shortcuts:
        - use locked source screenshot only for an independent topmost overlay or decoration that does not
          enter the existing layout tree
        - use compact local one-off overlay concepts only for the new requested element when it is not yet
          a reusable production component
        - defer full component audit and zoom crops until a direction is selected
        must_report:
        - exploration_draft
        - not_production_ready_when_source_frame_is_screenshot_or_core_instances_are_not_audited
        - what was reused from previous context
        - context_basis
        - basic_visual_gate
        - design_thesis
        - option_difference_result when multiple options are requested
        - production_gaps
        - first_stage_delivery
        forbidden:
        - claim production_ready
        - replace production delivery when user asks for 定稿 上线 沉淀组件 or 生产化
        - rebuild_existing_context_from_primitives
        - rebuild_existing_context_from_component_stack
        - trace_source_screenshot_into_local_text_rectangles_or_vectors
        - use_screenshot_overlay_for_structural_mutation
        - continue_screenshot_draft_as_production_base
        - use_local_one_off_overlay_for_status_bar_header_cards_lists_or_bottom_bar
      continuation_iteration:
        use_when:
        - user continues in the same conversation and asks to adjust compare combine weaken strengthen expand
          or refine existing options
        - previous output nodes screenshots assets component keys or route decisions are available in conversation
        default_route_profile: continuation_profile
        default_quality_tier: inherit_previous_quality_tier
        write_allowed: true_when_previous_output_context_is_valid
        required_first_step: read_previous_output_context_before_any_source_or_component_scan
        reuse_before_rerun:
        - previous_output_node_ids
        - uploaded_source_screenshot_asset_id
        - fixed_output_page_id_4608_4097
        - resolved_local_component_node_ids
        - known_mcp_constraints
        forbidden:
        - reread_full_skill_reference_stack
        - rerun_full_component_search_when_touched_component_family_is_unchanged
        - reexport_source_screenshot_when_existing_asset_is_valid
