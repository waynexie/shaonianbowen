    - quality_tier
    - context_strategy
    - context_basis
    - source_frame_id
    - source_screenshot_evidence
    - task_id
    - task_container_id
    - output_page_id
    - task_date
    - date_divider_id
    - date_divider_created_or_reused
    - placement_batch_frame_ids
    - placement_origin
    - selected_context_strategy_check
    - task_atomic_output_check
    - top_level_canvas_collision_check
    - persistent_write_scope_check
    - target_region
    - locked_regions
    - locked_context
    - new_local_element_scope
    - turn_intent_contract
    - allowed_mutations
    - mutation_scope_check
    - basic_visual_gate
    - production_gaps
    - presence_role
    - attention_budget
    - default_state
    - experience_profile_loaded when page_experience_routing requires it
    - extension_heuristic_used when page_experience_routing requires it
    - component_resolution_evidence
