        - user asks for 帮我做完 直接产出 完整生成 一次完成 最终交付 or equivalent one-pass completion
        - an automation or batch workflow requires a complete artifact without an interactive direction-selection
          turn
        default_route_profile: select_by_task_route
        default_quality_tier: production
        route_profile_selection:
          existing_context_local_mutation: local_mutation_profile
