  presence_role_taxonomy:
    purpose: classify how a new UI element exists in the current page before choosing size color placement
      or component form
    roles:
      primary_surface:
        meaning: main surface or main object for the current user task
        default_attention_budget: high
        default_state: expanded
      inline_entry:
        meaning: an entry or affordance embedded in existing content or a list item
        default_attention_budget: medium
        default_state: inline
      contextual_state:
        meaning: a local state marker inside an existing component such as media duration selected read or
          loading
        default_attention_budget: low
        default_state: inline
      persistent_companion:
        meaning: a cross-page or long-lived companion control for an ongoing task that must remain reachable
          without becoming the page focus
        default_attention_budget: low
        default_state: collapsed
      transient_feedback:
        meaning: short-lived feedback after an action such as toast or lightweight success error state
        default_attention_budget: minimal
        default_state: hidden_until_triggered
      modal_decision:
        meaning: a blocking or focused decision surface such as purchase confirmation selection or unlock
        default_attention_budget: high
        default_state: expanded
    attention_budget_values:
      high: may own the viewport focus when it is the current task
      medium: visible and easy to find but secondary to the main content
      low: reachable and legible without pulling focus from the main task
      minimal: background or brief signal only
    default_state_values:
    - expanded
    - collapsed
    - inline
    - hidden_until_triggered
    component_semantic_reuse_rule: 'Reuse component semantics, tokens, icon language, states and interaction
      meaning before reusing the full visual form. If an existing component''s full form exceeds the selected
      presence_role attention budget, extend the nearest family with a compact/collapsed/local state variant
      instead of mechanically placing the full component or drawing an unrelated substitute.

      '
