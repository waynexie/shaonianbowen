    - relevant component or icon family only when the target mutation touches it
    - matching screen-patterns.md profile only for module insertion, structure change, new state, or visual
      hierarchy change
    - references/figma-workflow.md and matching references/page-recipes.md recipe only for structural changes
      productionization or unresolved ambiguity
    orchestration_rule: choose context strategy from global_defaults.context_strategy_routing; preserve the
      exact source and locked regions; create all requested options in one task-scoped atomic call and inspect
      every full-frame screenshot
    required_fields:
