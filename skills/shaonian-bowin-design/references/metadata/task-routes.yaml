    - 重新设计
    - 发散
    - 换一版
    - 多方案
    - 不像原版
    - 样式不好看
    - 只改版式
    compatibility_note:
    - production_mode means source-preserving mutation posture, not quality_tier=production
    - exploration_mode still inherits existing-shell protection when a redesign starts from an existing page
  preflight_required_fields:
    route_profile_based: true
    source: route_profiles
    legacy_full_field_table: deprecated
  metadata_authority_gate:
    core_rule: No metadata authority loaded, no Figma write
    always_required:
    - references/metadata/task-routes.yaml
    required_for_write:
    - references/metadata/task-routes.yaml
    - references/metadata/validation.yaml
    required_when_components_or_variants_are_touched:
    - references/metadata/components.yaml
    required_when_tokens_variables_or_styles_are_touched:
    - references/metadata/tokens.yaml
    required_when_source_nodes_are_used:
    - references/metadata/source-registry.yaml
    required_when_screenshot_display_export_or_source_frame_duplication_is_needed:
    - references/metadata/source-frames.yaml
    required_when_local_visual_cache_is_used:
    - references/metadata/visual-cache.yaml
    missing_metadata_policy:
      l1_lookup_readonly:
        allowed: true
        required_label: source_index_only
        confidence: low
        must_not_claim:
        - figma_live_checked
        - full_validation_available
      figma_write:
        allowed: false
        return_status: metadata_unavailable
      exploration_draft:
        allowed_only_when:
        - references/metadata/task-routes.yaml_loaded
        - references/metadata/validation.yaml_loaded
        required_label: must_not_ship_as_production
    delivery_record_required:
    - metadata_loaded
    - missing_metadata_when_any
  execution_layers:
    core_rule:
    - Fast Path = readonly only
    - Any persistent Figma write = at least L2
    - Production delivery = L3 full validation
    - Exploration output must be marked exploration_draft and must_not_ship_as_production
    l1_lookup_readonly:
      applies_to:
      - existing_source_or_state_lookup
      - project_asset_lookup
      write_allowed: false
      persistent_write_allowed: false
      transient_render_allowed_only_when:
      - variable_mode_visual_lookup
      - temporary changes are restored or deleted before response
      - no source output or legacy-history nodes remain changed
      evidence_status_required: true
      evidence_status_values:
      - local_cache_checked
      - source_index_only
      - figma_live_checked
      - screenshot_checked
      source_index_only_policy: provisional_result_not_absence_proof
      allowed_actions:
      - read_source_index
      - read_source_registry
      - read_local_visual_cache
      - read_live_figma_source
      - read_component_library
      - take_or_return_screenshot
      - transient_variable_mode_render_with_cleanup
      - persist_and_validate_visual_attachment_for_final_response
      forbidden_actions:
      - persistent_write_figma
      - create_new_frame
      - leave_render_or_preview_frame
      - generate_missing_state
      - present_imagined_preview_as_existing_source
    l1_5_fast_visual_exploration:
      applies_to:
      - multi_option_exploration
      - quick_visual_direction
      write_allowed: true_with_draft_label
      required_before_write:
      - route_decision
      - speed_tier_decision
      - quality_tier_decision
      - nearest_source_or_previous_output_context
      - context_basis
      - target_region
      - locked_context
      - new_local_element_scope
      - design_thesis
      - production_gap_plan
      - touched_component_or_icon_family_when_used
      - persistent_write_scope_plan
      allowed_actions:
      - create_dated_top_level_frames_on_fixed_output_page
      - use_locked_source_screenshot_or_previous_output_as_visual_context_background
      - add_local_one_off_overlay_or_state_concepts_only_for_the_requested_new_element
      - use known local component node IDs without repeating component search
      - prefer_core_token_binding_on_new_visible_ui
      - screenshot_full_frame_after_write
      - run_universal_basic_visual_check
      forbidden_actions:
      - claim_production_ready
      - mutate_official_source_pages
      - reconstruct_existing_page_module_or_component_context_from_primitives
      - reconstruct_existing_page_module_or_component_context_from_component_stack
      - trace_locked_screenshot_into_local_text_rectangles_or_vectors
      - use_local_one_off_overlay_for_existing_status_bar_header_cards_lists_or_bottom_bar
      - leave_new_visible_ui_with_raw_core_visual_values_without_gap_or_explicit_raw_visual_sketch
      - run_full_production_gate_before_visual_direction_if_user_only_asked_to_compare_options
      delivery_label_required:
      - exploration_draft
      - productionization_required_after_selection
      always_blocking:
      - universal_basic_visual_gate_failure
      - existing_shell_or_locked_context_changed
      - invalid_multi_option_difference
      - registered_component_family_gate_failed
      report_as_production_gaps:
      - token_or_style_binding_incomplete
      - dark_mode_not_validated
      - auto_layout_or_component_properties_not_production_ready
      - unregistered_new_componentization_gap
    l1_6_continuation_iteration:
      applies_to:
      - same_thread_refinement
      - compare_or_merge_existing_options
      write_allowed: true_when_previous_context_exists
      required_before_write:
      - previous_output_context_checked
      - target_nodes_or_assets_to_reuse
      - delta_from_previous_option
      - persistent_write_scope_plan
      allowed_actions:
      - duplicate_or_modify_previous_output_frame
      - reuse_uploaded_screenshot_asset
      - reuse_resolved_local_component_node_ids
      - perform_targeted_screenshot_check
      forbidden_actions:
      - restart_full_preflight_without_new_dependency
      - reread_unrelated_references
      - rerun_design_system_gate_for_unchanged_component_family
    l2_local_light_mutation:
      applies_to:
      - existing_context_local_mutation
      write_allowed: true_after_gate
      allowed_only_when:
      - target_region_is_small_or_explicit
      - closest_complete_source_screenshot_is_available
      - locked_regions_are_recorded
      - source_protection_and_universal_basic_visual_gate_pass
      never_skip:
      - source_frame_id
      - source_screenshot_evidence
      - task_id
      - task_container_id
      - target_region
      - locked_regions
      - mutation_scope_check
      - registered_component_family_gate
      - screenshot_visual_check
      - universal_basic_visual_check
      - persistent_write_scope_check
      - production_gaps
      design_system_gate_levels:
        text_style_gate:
          applies_when:
          - text_only_edit
          - no_component_structure_change
          required_checks:
          - source_frame_duplicated
          - target_text_size_line_height_color_hierarchy_and_alignment_preserved
          - locked_regions_unchanged
          - screenshot_visual_check
        target_component_gate:
          applies_when:
          - icon_change
          - button_change
          - component_state_change
          - image_or_asset_replacement
          required_checks:
          - text_style_gate
          - touched_component_or_icon_family_verified
          - registered_component_family_gate
          - no_parallel_local_component_family
        full_design_system_gate:
          blocking_when:
          - quality_tier_is_production
          draft_behavior: enforce registered_component_family_gate and record token Auto Layout dark-mode and
            unregistered new componentization gaps in production_gaps
          applies_when:
          - layout_change
          - overlay_or_sheet_or_popover_change
          - card_or_navigation_or_bottom_bar_change
          - reusable_component_or_variant_change
          required_checks:
          - figma_design_system_gate_check
          - component_instance_or_variant_check
          - token_and_style_binding_check
          - screenshot_visual_check
    l3_production_or_exploration:
      applies_to:
      - new_context_exploration
      - component_or_variant_design
      - production_delivery
      production_required:
      - full_design_system_gate
      - full_validation
      - screenshot_visual_check
      - persistent_write_scope_check
      exploration_required:
      - divergence_contract
      - design_thesis_per_option
      - option_difference_result_when_multiple_options
      - universal_basic_visual_check
      - production_gaps
      - exploration_draft_label_when_not_production_ready
      - must_not_ship_as_production_when_any_core_gap_exists
  forbidden_fallbacks:
  - hand_draw_status_bar
  - hand_draw_navigation_bar
  - hand_draw_bottom_bar
  - hand_draw_existing_card_or_cell_family
  - replace_locked_region_with_local_copy
  - primitive_substitution_for_ready_to_force_in_locked_source_shell_or_production
  - raw_value_substitution_for_core_tokens_in_production
  - mechanical_component_stack_without_design_check
  - missing_context_basis_before_figma_write
  - source_context_reconstruction_from_primitives
  - unverified_source_context_reconstruction_from_component_stack
  - source_context_reconstruction_from_screenshot_tracing
  - unbounded_full_page_reconstruction_for_existing_context
  - write_outside_authorized_scope
  - top_level_frame_overlap
  responsive_layout_policy:
    applies_to: all newly generated or modified native screens and components
    baseline_width: 390
    verification_widths:
    - 320
    - 360
    - 375
    - 390
    - 414
    - 430
    rules:
    - Use Auto Layout for related layout containers; Group is not a layout container.
    - Page content and cards fill available parent width; preserve context-specific side padding.
    - Text wraps with fixed available width and Hug height; do not reserve hidden button space.
    - Icons and avatars retain fixed geometry; text consumes remaining width.
    - Two-column options use equal Fill children; word tokens wrap naturally.
    - Consent icon and left-aligned text use 4px gap, top-aligned on multiline text.
    - Fixed bottom actions account for safe area; scroll content must remain reachable above actions.
    - Do not claim whole-screen responsiveness based only on component resizing.
    - Verify actual screenshots at narrow and wide widths plus long-content states.
    failure_policy: repair affected layout before accepting; record remaining whole-page migration gaps
    source_existing_screens: audit and explicitly scope structural migration; do not silently redesign approved
      screens
  scene_index_first_policy:
    order:
    - reuse_exact_current_turn_evidence
    - query_scene_index_locally
    - resolve_matched_component_catalog_entries
    - read_exact_live_master_before_design_write
    - search_only_on_missing_stale_ambiguous_or_incompatible_index
    scene_source: references/metadata/scene-index.yaml
    entry_command: python3 scripts/query_runtime_index.py "<scene or component>" --intent locate --compact
    lookup_only: Return indexed scene, source screen, family IDs and representative master IDs without live
      master reads for ordinary locating or selection. Declare source_index_only, not live_verified.
    write_tasks: Resolve exact master or variant from matched components.yaml entry; read current live properties,
      variants, resizing, slots and relevant variable bindings before creating or modifying instances. Index
      and review examples never substitute for masters.
    visual_queries: Use --intent visualize; exact valid screenshot cache or targeted live screen rendering.
      Rendering a screen does not require scanning its entire component library. Dark-mode verification rules
      remain unchanged.
    fallback: If scene mapping is absent, try the component runtime index, then bounded live search for unresolved
      semantics. Invalid IDs, ambiguity or unavailable variants require targeted search; do not scan all pages
      by default.
    tool_requirements: If the active MCP requires a library/search preflight, perform the minimum scoped lookup
      after local index resolution; do not treat it as authorization for an all-library scan.
    refresh: Record discovered stale mappings and update them only within explicit Skill/index maintenance
      authorization; ordinary read-only lookup must not publish Skill changes.
    variant_gallery_role: locator_only_not_component_authority_or_responsive_validation
    variant_gallery_lookup_rule: use instance_id and variant_master_id for lookup and write preparation; card_id
      is visual presentation only and must not trigger a card traversal
route_decision:
  required_before_any_workflow: true
  fields:
  - semantic_intent
  - task_route_type
  - confidence
  - evidence
  - write_allowed
  - fallback_route
  confidence_rules:
    high: continue_with_selected_route
    medium: read_only_or_conservative_preflight_only_no_figma_write
    low: ask_user_before_any_write_or_generation
  rollback_rules:
    generation_or_mutation_mistaken: existing_source_or_state_lookup
    exploration_mistaken: existing_context_local_mutation
    component_mistaken: source_component_family_lookup
  write_permission:
    existing_source_or_state_lookup: false
    existing_context_local_mutation: true_when_selected_context_strategy_source_protection_and_task_atomic_output_gates_pass
    component_or_variant_design: true_when_component_family_verified_and_either_output_only_draft_policy_or_explicit_formal_component_maintenance_scope_is_recorded
    new_context_exploration: true_when_source_context_and_divergence_contract_recorded
turn_intent_contract:
  required_before:
  - component_selection
  - page_recipe_application
  - figma_write
  - multi_option_generation
  purpose: make the user's current-turn explicit request outrank default recipes and full component shapes
    while preserving design-system semantics.
  extraction_source:
  - latest_user_message
  - attached_reference_images_or_markups
  - explicit correction from the current thread
  required_fields:
  - user_goal
  - explicit_user_constraints
  - excluded_fields_or_elements
  - required_fields_or_elements
  - occlusion_budget
  - locked_context
  - component_semantic_reuse_policy
  - conflict_resolution
  optional_fields:
  - field_budget
  - visual_weight_override
  - required_archetype_divergence
  - allowed_component_shape_change
  priority_rule:
  - explicit current-turn constraints outrank default page recipes component defaults and historical examples
  - keep component semantics tokens icons states and interaction meaning before keeping full component geometry
  - when a component's default fields conflict with excluded_fields_or_elements remove or hide those fields
    before resizing or restyling
  - when the requested presence_role is low or minimal do not use a full source component shape merely because
    the component exists
  conflict_resolution_values:
    skill_rule_overridden_by_turn_intent: allowed_when_component_shape_or_default_fields_conflict_with_explicit_user_constraints
    ask_or_degrade: use_when_user_constraints_and_hard_component_requirements_cannot_both_be_satisfied
    hard_stop: use_when_source_protection_core_tokens_or_ready_to_force_semantics_would_be_broken
  must_not:
  - reintroduce a user-excluded field because it exists in a default component
  - preserve full component form when the turn requests a lighter or less intrusive presence
  - treat component reuse as more important than the stated user outcome
  - generate multiple options that ignore the requested difference axis
execution_handoff_policy:
  role: internal_design_execution_evidence
  orchestration_owner: agent
  mechanical_execution_owner: agent_using_available_tools
  presentation_owner: agent_result_through_transparent_platform
  preserve_route_profiles: true
  skill_owns:
  - semantic_route
  - source_and_component_resolution
  - cache_eligibility
  - design_rules
  - validation_evidence
  - visual_query_delivery_completion_contract
  agent_owns:
  - shortest_execution_path
  - tool_capability_detection
  - figma_read_render_write_when_tools_allow
  - within_turn_read_deduplication
  - retry_and_timeout_policy
  - degradation_sequence
  - final_response_assembly
  - durable_visual_attachment_reference
  platform_owns:
  - request_forwarding
  - ordered_agent_process_display
  - unchanged_agent_result_display
  - canvas_transport_and_display
  - task_bound_annotation_transport
  - session_isolation
  - authentication_rate_limit_timeout_reconnect_idempotent_retry_and_file_transfer
  platform_forbidden:
  - business_intent_classification
  - shaonian_bowin_semantic_interpretation
  - figma_query_or_node_counting
  - authority_source_selection
  - business_prompt_or_result_template
  - agent_result_summary_correction_completion_or_reordering
  - unavailable_status_replacement
  - historical_business_context_injection
  - business_answer_cache_reuse
  capability_rule: the Agent executes or degrades according to its actual tools; the Skill never assumes the
    platform will add tools render Figma repair a result or complete business logic
  must_not_control:
  - final_user_response_layout
  - exact_platform_transport_implementation
  - non_visual_link_format
  - user_visible_technical_fields
  must_not_weaken:
  - lookup_readonly_boundary
  - source_frame_resolution
  - figma_write_scope
  - source_context_protection
  - production_component_and_token_gates
  - universal_basic_visual_gate
  - screenshot_visual_check
route_profiles:
  lookup_profile:
    applies_to:
    - existing_source_or_state_lookup
    - project_asset_lookup
    write_allowed: false
    figma_write_allowed: false
    skill_cache_write_allowed: explicit_visual_cache_refresh_only
    minimum_reads:
    - python3 scripts/read_execution_profile.py profile lookup_profile
    - exact uploaded current-turn gallery reference when available, otherwise python3 scripts/query_runtime_index.py
      with the user target and --intent locate for locating/selection or --intent visualize for visual queries
    - smallest matching authority section through python3 scripts/read_metadata_section.py only when the runtime
      result is ambiguous stale unsupported or transitions to a write route
    conditional_reads:
      current_turn_gallery_reference:
      - uploaded_preview_file
      - provided_file_key
      - provided_node_id
      source_screen:
      - references/source-index.md
      - references/metadata/source-frames.yaml
      component_or_asset:
      - references/metadata/components.yaml
      - references/metadata/source-registry.yaml
      cache_candidate:
      - references/metadata/visual-cache.yaml
      freshness_or_state_mismatch:
      - live_figma_source
      explicit_generated_work_lookup:
      - fixed_generated_output_page
      scene_component_mapping:
      - references/metadata/scene-index.yaml matched record via runtime index
    orchestration_rule: prefer exact current-turn reference evidence, then return only matched runtime records
      and load only the conditional authority branch needed for ambiguity or escalation; ordinary lookup allows
      at most one target-resolution call and one screenshot or attachment persistence path, with one corrective
      retry only for an explicit tool error
    required_fields:
    - route_decision
    - resolved_target
    - evidence_status
    - write_allowed
    - source_nodes_checked
    - screenshot_or_node_candidates
    - found_existing_state_or_not_found_in_source
    - requested_appearance_mode when visual evidence is requested
    - actual_rendered_appearance_mode when visual evidence is delivered
    - appearance_mode_verification_status when visual evidence is requested
    optional_fields:
    - current_turn_reference_reused
    - cache_id
    - cache_status
    - cache_captured_at
    forbidden:
    - persistent_write_figma
    - create_new_frame
    - leave_render_or_preview_frame
    - generate_new_state
    - present_imagined_preview_as_existing_source
    component_resolution_policy_ref: global_defaults.scene_index_first_policy
  continuation_profile:
    applies_to:
    - same_thread_refinement
    - compare_or_merge_existing_options
    - adjust_existing_generated_option
    write_allowed: true_when_previous_output_context_exists
    required_reads:
    - previous conversation output context
    - live generated-output page metadata for referenced nodes when available
    - only newly touched component reference if the delta introduces a new component family
    - matching screen-patterns.md profile only when the requested delta changes page structure, module role,
      visual hierarchy, or state model
    required_fields:
    - route_decision
    - speed_tier_decision
    - quality_tier
    - previous_output_context
    - context_strategy
    - context_basis
    - turn_intent_contract
    - target_nodes_or_assets_to_reuse
