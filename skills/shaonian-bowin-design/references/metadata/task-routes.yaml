schema_version: 1
purpose: route common Shaonian Bowen design requests to source nodes, page patterns, component families, and
  validation gates
authority: 'Single source of truth for routing, execution layers, route profiles, gate levels, global defaults
  and mode routing. SKILL.md and references/*.md only reference these rules; if md and this file disagree,
  this file wins. Term glossary (English snake_case -> Chinese): references/metadata/glossary.yaml.

  '
usage:
- Use the compiled runtime query scripts first; load only the smallest matching authority section before write,
  on ambiguity, or when the runtime index is stale or unsupported.
- Pick every route that matches the user request; if multiple routes match, preserve the narrower locked region.
- A route chooses source and components; page-recipes.md controls production assembly and screen-patterns.md
  controls page experience, visual rhythm, state deltas, and extension boundaries.
- If a listed source node or component is unavailable through Figma MCP, stop and report the missing dependency
  unless fallback_allowed is true.
global_defaults:
  source_figma_file_key: oULxBlEvFNkWGGVaJ0ClEz
  source_file_policy: source_pages_read_only_output_page_write_only_except_explicit_formal_component_or_scene_index_maintenance
  output_file_policy: native_source_file_fixed_output_page
  output_figma_file_key_ref: global_defaults.source_figma_file_key
  output_figma_file_name: 少年博闻 Component Architecture v2
  output_page: 界面生成方案
  output_page_id: 4608:4097
  output_page_role: output_only
  cross_file_operation_policy: forbidden
  output_frame_naming: <页面或模块> / <需求短名>
  output_frame_name_date_policy: forbidden_date_prefix
  output_frame_name_collision_policy: append_short_sequence_within_same_day
  source_product_and_component_pages_writable: explicit_formal_component_maintenance_only
  output_page_writable: true
  create_new_page_per_task: false
  viewport: 390x844
  live_figma_source_first: true
  appearance_mode_routing:
    purpose: make the visual color mode for every visual lookup and Figma write explicit and prevent source
      state previews or prior turns from leaking into the requested result
    applies_to:
    - every ordinary visual lookup
    - screenshot or cached visual delivery
    - every Figma generation or mutation
    default_mode: light_default
    precedence:
      explicit_dark_visual_lookup: higher_than_existing_state_lookup_cache_selection_and_parent_fallback
    dark_mode_allowed_only_when:
    - the current user turn explicitly requests 夜间模式 暗色模式 深色模式 dark mode or dark output
    - the current user turn explicitly says to preserve or continue the current dark or night mode
    rules:
    - when the current turn does not explicitly select a visual mode set requested_appearance_mode to light_default
      before any lookup cache decision render mutation or creation
    - a dark reference screenshot dark source node prior dark-mode lookup previous conversation state workspace
      state or current Figma variable state is context only and must not imply dark output
    - read-only variable-mode lookup state must never carry into a later write task
    - current-turn explicit mode wording outranks reference image appearance and historical conversation context
    - explicit night or dark visual lookup enters routes.existing_source_or_state_lookup.variable_mode_visual_lookup
      before ordinary source-state fallback
    - an active unexpired exact same-node same-mode cache completes the lookup directly
    - every other explicit night or dark lookup requires live Figma variable collection inspection and transient
      rendering on the same resolved target
    - parent not_found_in_source and generation invitation apply only to ordinary lookups outside variable_mode_visual_lookup
    - set the intended variable mode explicitly on the output frame and validate the full-frame screenshot
      in that same mode
    - before delivering any visual record both requested_appearance_mode and actual_rendered_appearance_mode
      and require an exact match
    - an unknown unverified or mismatched actual_rendered_appearance_mode is never deliverable
    - when live rendering cannot produce the requested mode use only an active unexpired cache whose source_node_id
      and appearance_mode exactly match the resolved target and requested mode
    - if neither verified live rendering nor an exact same-node same-mode cache is available return requested_appearance_unavailable
      without substituting another mode
    - restore any temporary source-node variable mode after lookup or inspection and never persist the temporary
      mode to source nodes
    - do not add dark night or 夜间 to the output frame name unless dark output was explicitly requested in the
      current turn
    required_record: appearance_mode
    default_record_value: light_default
    forbidden:
    - infer_dark_from_reference_image_only
    - inherit_dark_from_previous_lookup_or_conversation
    - inherit_dark_from_workspace_or_current_figma_state
    - leave_appearance_mode_implicit_before_write
    - leave_appearance_mode_implicit_before_visual_lookup
    - deliver_unknown_or_unverified_appearance_mode
    - deliver_live_or_cached_visual_with_mismatched_appearance_mode
    - substitute_dark_for_default_light_lookup
  structured_annotation_routing:
    purpose: execute task-bound canvas annotations against the exact Figma target and coordinate space selected
      by the user
    applies_when:
    - the request contains one or more structured annotations
    - the user submits a canvas box or arrow feedback round
    authority_order:
    - annotation.target file_key and node_id
    - annotation.surface_id and target_scope
    - annotation.normalized_start and normalized_end
    - annotation.local_start and local_end with surface_bounds
    - attached annotated screenshot as corroborating visual evidence
    - annotation text as requested delta
    rules:
    - treat every annotation as a task-bound delta on its exact target node rather than a new standalone design
      request
    - resolve annotation target.file_key and target.node_id before mutating Figma
    - use normalized coordinates for target-region mapping when source dimensions differ from the preview surface
    - use local coordinates only together with surface_bounds and coordinate_space
    - use the annotated screenshot to verify region identity but never replace structured coordinates with
      a guessed screenshot location
    - preserve everything outside the union of annotated target regions unless annotation text explicitly requests
      a wider dependent change
    - if target identity scope or coordinate evidence conflicts stop before write and return structured_annotation_scope_mismatch
    forbidden:
    - infer_target_from_annotation_text_only
    - use_global_start_end_without_surface_bounds
    - treat_preview_css_pixels_as_source_node_pixels
    - modify_outside_annotated_region_without_explicit_dependency
    - ignore_normalized_coordinates_when_preview_and_source_dimensions_differ
    unavailable_status: structured_annotation_evidence_unavailable
  semantic_ambiguity_routing:
    purpose: resolve words that have both a product meaning and a Figma technical meaning without silently
      changing authority
    resolution_order:
    - current product or business context
    - explicit noun qualifiers in the current turn
    - Figma technical meaning only when explicitly requested or when no product meaning is applicable
    rules:
    - preserve the current business question as the primary answer when both meanings are valid
    - disclose each materially different technical count or definition as a separately labeled alternate scope
    - state the authority source used for every reported scope
    - never switch from source-frames product authority to live Figma Page Canvas node counts without disclosure
    - a current Page selection node subtree or viewport result never proves the file-wide Figma Page count
    - report a Figma technical Page count only after enumerating every direct Page or Canvas child from the
      target file Document root
    - when reporting a Figma technical Page count include the enumerated Page names and node IDs so the count
      is auditable
    - derive counts from the current authority data at execution time and never copy a regression snapshot
      into an answer rule
    technical_page_count_contract:
      applies_when:
      - the user explicitly asks for Figma Page Canvas or top-level page count
      - a product page-count answer also reports the materially different Figma technical scope
      authority: live Figma target-file Document root
      required_evidence:
      - queried_file_key matches the configured source_file_key
      - queried_scope is document_root rather than current_page selection viewport or descendant subtree
      - page_inventory contains every direct child whose node type is PAGE or CANVAS
      - every page_inventory item includes node_id and name
      - reported_page_count equals the length of page_inventory
      rejected_evidence:
      - current Page metadata only
      - selected node or selected Frame ancestry
      - viewport-visible nodes
      - a single Page or Canvas subtree
      - an unlabeled count without page_inventory
      fallback_status: figma_document_page_inventory_unavailable
    regression_examples:
    - query: 目前共有多少页面
      primary_scope: product_display_screens
      primary_authority: references/metadata/source-frames.yaml
      dynamic_calculation: count frames where node_role is screen_frame and exportable is true and status is
        not stale or missing
      alternate_scope_when_relevant: Figma technical Page or Canvas count from explicitly labeled live Figma
        evidence
      forbidden:
      - hardcode_expected_count
      - add_page_count_service
      - silently_answer_only_figma_page_count
    - query: 这个 Figma 文件有几个顶层 Page
      primary_scope: figma_technical_pages
      primary_authority: live Figma target-file Document root
      dynamic_calculation: enumerate direct PAGE or CANVAS children and return their node_id and name before
        reporting the list length
      forbidden:
      - count_current_page_as_document
      - count_selected_subtree_as_document
      - report_count_without_page_inventory
    unavailable_status: authority_scope_unavailable
  visual_query_delivery:
    purpose: require an actually visible final image for requests such as 长啥样 给我看 看一下 夜间效果 or other visual-preview
      wording
    applies_when:
    - lookup response depends on an uploaded current-turn gallery reference preview whose file key and node
      id match the resolved target
    - lookup response depends on a cached screenshot
    - lookup response depends on a live Figma screenshot or transient variable-mode render
    - user explicitly asks to see a page component asset state or visual effect
    completion_contract:
    - an exact uploaded current-turn gallery reference preview is reusable evidence and must not trigger another
      Figma screenshot unless the user asks for latest realtime current version or a different state or appearance
      mode
    - temporary tool preview or commentary image is not final delivery
    - persist the selected image under an explicitly allowed durable root before final response
    - upload or register the image through the platform and obtain a user-accessible delivery URL or attachment
      reference
    - run python3 scripts/validate_visual_attachment.py with allowed-root and delivery-url
    - include the validator returned markdown_image in the final response
    - verify the local path still exists is nonempty has a recognized image signature and resolves inside the
      allowed root immediately before response
    - disclose whether evidence came from an exact current-turn gallery reference exact fresh cache or live
      Figma rendering
    durable_path_policy:
      required: absolute_path_with_allowed_root
      allowed: workspace_or_persistent_skill_asset_path
      forbidden:
      - short_lived_remote_url
      - tool_only_image_payload
      - commentary_only_preview
      - temporary_directory_path
      - path_outside_allowed_root
      - local_path_used_as_user_delivery_url
    failure_status: visual_attachment_unavailable
    failure_behavior:
    - explicitly report visual_attachment_unavailable and the failed persistence or validation step
    - do not claim that the image is shown
    - do not say 见上图 上图如下 or refer to a tool preview
    required_delivery_evidence:
    - visual_evidence_origin
    - visual_attachment_path
    - visual_attachment_format
    - visual_attachment_size_bytes
    - visual_attachment_validation_status
    - platform_delivery_url_or_attachment_reference
    - final_attachment_markdown
  generated_output_delivery:
    purpose: make every top-level output Frame delivered by the current turn independently visible on the Sol
      canvas
    applies_when:
    - a Figma write creates one or more top-level output Frames
    - a continuation or annotation turn delivers multiple visual states such as base page plus popup expanded
      selected loading or empty state
    - the current turn creates or mutates more than one top-level Frame as part of the accepted result
    completion_contract:
    - determine delivery_frame_ids from every top-level output Frame that constitutes the current-turn result
      whether newly created mutated or intentionally reused
    - capture and persist one full-frame screenshot for every delivery_frame_id after validation
    - return generated_figmas as an ordered array with exactly one item per unique delivery_frame_id
    - every generated_figmas item includes file_key node_id name url image_url width and height
    - keep generatedFigma or generated_figma only as an optional first-item compatibility alias and never use
      it to replace or truncate generated_figmas
    - preserve the intended visual order such as base state before popup state or option A before option B
    - verify generated_figmas length equals the unique delivery_frame_ids length before final response
    forbidden:
    - return_only_one_representative_when_multiple_frames_were_delivered
    - return_a_parent_group_or_page_instead_of_each_delivery_frame
    - omit_a_frame_because_another_frame_has_a_similar_base_layout
    - return_node_without_its_corresponding_persisted_screenshot
    - make_the_platform_scan_figma_or_guess_sibling_frames
    required_records:
    - delivery_frame_ids
    - generated_figmas
    - generated_figmas_count
    - generated_output_screenshot_count
    - generated_output_delivery_count_match
    failure_status: generated_output_delivery_incomplete
  preserve_existing_page_when_modifying: true
  context_strategy_routing:
    purpose: use one direct output strategy for each task class and preserve existing source pages as readonly
      authorities
    values:
      screenshot_overlay:
        allowed_only_when:
        - fast_visual_exploration
        - new element is a topmost independent overlay or decoration
        - existing layout tree content size order component state text and variable mode remain untouched
        - user does not require editable production output or dark-mode preview
        required_labels:
        - exploration_draft
        - must_not_ship_as_production
      direct_native_construction:
        required_when:
        - the user requests a new page or a production-ready output built from verified components and variables
        - productionization or componentization requires fully editable native layers
        construction:
        - create a new task-scoped output Frame directly on the fixed output Page
        - build with verified local components variables Auto Layout and the MCP default text engine
        - validate the full frame and every changed region before delivery
      source_locked_visual_draft:
        allowed_only_when:
        - the user requests a visible draft exploration or multiple options rather than production-ready native
          output
        - the exact source Frame and target_region were resolved before construction
        - the official source Frame remains unchanged
        construction:
        - place a full-frame screenshot of the exact source Frame as a locked immutable background inside a
          new output-only Frame
        - cover only target_region with a source-matched local background and rebuild only the requested target
          region as editable native layers
        - preserve every region outside target_region pixel-for-pixel through the locked source screenshot
        - create every requested option as a separate top-level Frame and screenshot-validate each option
        required_labels:
        - source_locked_visual_draft
        - exploration_draft
        - must_not_ship_as_production
        forbidden:
        - claim_production_ready
        - use_the_draft_as_a_future_production_base
        - redraw_or_reconstruct_regions_outside_target_region
    default_by_delivery:
      visible_draft_or_multi_option: source_locked_visual_draft
      new_page_or_production_native_output: direct_native_construction
    default_when_uncertain: source_locked_visual_draft
    forbidden:
    - use_screenshot_overlay_for_structural_mutation
    - continue_screenshot_draft_as_production_base
    - unbounded_full_page_reconstruction_for_existing_context
    existing_context_rule: visible drafts lock the exact source screenshot outside target_region; production/native-editable
      output uses verified native components and compares all locked regions against the exact source; no screenshot
      production base or unverified approximate reconstruction
  registered_component_family_gate:
    purpose: preserve the product design system whenever the route or component catalog resolves an existing
      component family
    precedence: higher_than_speed_tier_quality_tier_context_strategy_and_production_gaps
    applies_to: every_generation_or_figma_write_request
    required_when:
    - route declares must_use_components or primary_components
    - components.yaml marks a component ready_to_force or required_instance
    - source-index or live Figma resolves a nearest same-semantic component family or source instance
    required_evidence:
    - resolved_component_family
    - source_component_or_instance_node_id
    - delivered_instance_or_same_family_extension_node_id
    - component_property_or_variant_changes
    - target_region_screenshot_check
    pass_when:
    - registered component is delivered as an instance existing variant or documented same-family extension
    - recipe-governed component starts from the registered instance or nearest matching source instance
    blocking_failures:
    - registered_component_replaced_by_local_frames_groups_vectors_or_flattened_image
    - required_instance_or_source_extension_unresolved
    - parallel_component_family_created_while_registered_family_exists
    - component_source_or_delivery_evidence_missing
    production_gaps_scope:
    - token_binding_incomplete
    - style_binding_incomplete
    - auto_layout_or_component_properties_not_production_ready
    - dark_mode_not_verified
    - unregistered_new_componentization_gap
  task_atomic_output:
    applies_when: ordinary_generated_output_or_output_page_audit_preview
    excludes:
    - direct_formal_component_maintenance_on_authorized_source_nodes
    - explicit_scene_index_maintenance_on_authorized_index_page
    source_file_key_ref: global_defaults.source_figma_file_key
    target_page_id_ref: global_defaults.output_page_id
    task_identity: task_id
    task_container_name: task/{task_id}
    execution:
    - resolve source evidence before the write call
    - perform task container creation option creation date placement and collision recheck in one use_figma
      call
    - read the latest output Page children at the beginning of that atomic call
    - use task_id as the idempotency key and return the existing matching task container only when its requested
      delta and screenshot evidence match
    - return every created and mutated node id before the call completes
    concurrency_result: concurrent tasks use independent task containers and fresh in-call placement state
    text_runtime:
      policy_ref: references/metadata/tokens.yaml#typography.runtime_text_policy
      rule: create or modify text with the MCP default text engine
  canvas_placement_policy:
    target_page_id_ref: global_defaults.output_page_id
    target_page_name_ref: global_defaults.output_page
    top_level_node_type: FRAME
    create_outer_section_or_wrapper: false
    create_new_page_per_task: false
    task_batch_layout: rows
    batch_start_x: 0
    option_horizontal_gap: 120
    task_vertical_gap: 240
    task_atomic_output_ref: global_defaults.task_atomic_output
    task_date_policy:
      timezone: Asia/Shanghai
      format: YYYY-MM-DD
      source: agent_execution_clock
      platform_task_date: optional_timestamp_input_only
      rule: normalize once at task start and use the same task_date for the whole atomic write
    date_divider:
      enabled: true
      pattern_ref: references/metadata/source-registry.yaml#output_only_pages.0.layout_utilities.date_divider
      one_per_task_date: true
      canonical_frame_name: Date / <YYYY-MM-DD>
      visible_text: <YYYY-MM-DD>
      node_type: FRAME
      x: 0
      height: 120
      min_width: 1974
      width_rule: max(min_width_current_day_batch_right_edge)
      text_alignment: center
      day_section_gap: 240
      divider_to_first_task_gap: 120
      shared_plugin_data:
        namespace: shaonian_bowen_design
        node_role_key: node_role
        node_role_value: date_divider
        task_date_key: task_date
      legacy_match:
      - top-level Frame named date with an exact descendant date text
      - top-level Frame whose visible text exactly equals task_date and whose height matches the registered
        pattern
      deduplication:
      - scan shared plugin data first then canonical name and legacy match
      - immediately recheck the task_date divider before creating one
      - if a duplicate appears remove only the divider created by the current atomic operation and reuse the
        pre-existing canonical divider
      - never delete or merge a divider created by another completed task
    placement_algorithm:
    - inspect all existing top-level scene-node absolute bounding boxes on the output page
    - resolve task_date in Asia/Shanghai once for the current task
    - find the unique divider for task_date through shared plugin data canonical name or legacy match
    - if no divider exists place it at y=existing_max_bottom+date_divider.day_section_gap and register its
      shared plugin data
    - tag every new task Frame with the same task_date and node_role=output_frame
    - calculate current_day_max_bottom from the divider and task Frames tagged with task_date
    - place the first task of a new day at divider.bottom+date_divider.divider_to_first_task_gap
    - place later tasks on the same day at current_day_max_bottom+task_vertical_gap
    - place additional options to the right using previous_x+previous_width+option_horizontal_gap and the same
      row y
    - use each frame's real width and height; never assume 390x844 for collision math
    - do not move or normalize existing frames automatically
    - run pairwise top-level collision detection after placement
    - if the new batch collides move the whole batch below the maximum conflicting bottom plus task_vertical_gap
      and recheck
    - expand only the current date divider when the current day batch exceeds its width
    required_records:
    - output_page_id
    - task_date
    - date_divider_id
    - date_divider_created_or_reused
    - placement_batch_frame_ids
    - placement_origin
    - top_level_canvas_collision_check
    blocking_failures:
    - output_page_not_exact_match
    - new_page_created_for_task
    - outer_section_or_wrapper_created
    - task_date_missing_or_wrong_timezone
    - date_divider_missing_for_task_date
    - duplicate_date_divider_left_by_current_operation
    - output_frame_name_contains_date_prefix
    - task_frame_not_grouped_under_task_date_divider
    - top_level_frames_overlap
    - placement_not_validated_after_write
    growth_monitor:
      warning_only: true
      warn_when_top_level_node_count_reaches: 80
      warn_when_max_bottom_reaches: 100000
      warning_status: output_page_growth_warning
      continuation_rule: refine or duplicate the selected prior option instead of creating a new task row for
        every minor iteration
      forbidden_automatic_actions:
      - delete_existing_output
      - move_existing_output
      - create_archive_page
      - create_archive_section
  persistent_write_scope:
    purpose: enforce the fixed output-page boundary by default and exact allowlists for explicit formal component
      or scene-index maintenance
    enforcement_timing: inside the same atomic use_figma call before return
    applies_to:
    - fast_visual_exploration
    - continuation_iteration
    - existing_context_local_mutation
    - new_context_exploration
    - component_or_variant_design
    - productionization
    target_file_key_ref: global_defaults.source_figma_file_key
    default_target_page_id_ref: global_defaults.output_page_id
    formal_component_maintenance_scope:
      enabled_only_when:
      - user explicitly asks to maintain or promote the formal component library
      - component_or_variant_design route confidence is high
      - exact authorized_formal_page_ids and authorized_source_frame_ids are recorded before write
      allowed_persistent_targets:
      - nodes descending from authorized_formal_page_ids
      - explicitly authorized source frames when replacing local modules with the newly promoted instances
      - canonical output Page for audit previews
      forbidden:
      - broad page-level authorization
      - mutate unrelated siblings on an authorized Page
      - publish components automatically
      - change tokens icons assets navigation or product content outside the approved componentization scope
    scene_index_maintenance_scope:
      enabled_only_when:
      - user explicitly asks to maintain the scene index or its variant gallery
      - exact authorized_scene_index_page_id matches references/metadata/scene-index.yaml#variant_gallery.page_id
      allowed_persistent_targets:
      - the authorized scene index Page and its descendants only
      forbidden:
      - create a new Page for the index
      - mutate official product screens component masters variables or assets
      - treat index examples as formal component masters
    required_return_fields:
    - created_node_ids
    - mutated_node_ids
    - removed_node_ids_when_any
    post_write_algorithm:
    - resolve every returned persistent created or mutated node ID after the operation
    - for ordinary tasks allow only the canonical output Page node itself or its descendants
    - for explicit formal component maintenance allow only the exact authorized targets above and require all
      other official source nodes to be absent from mutated_node_ids
    - for explicit scene index maintenance allow only the recorded index Page and its descendants, with official
      product screens and component masters absent from mutated_node_ids
    - require temporary nodes to be removed and listed separately
    - fail closed when an existing returned node cannot be resolved to the current explicitly authorized scope
    - throw persistent_write_scope_violation before return so the atomic Figma operation rolls back
    pass_record:
    - persistent_write_scope_check
    - persistent_node_page_map
    - write_scope_mode
    - authorized_formal_page_ids
    - authorized_source_frame_ids
    - authorized_scene_index_page_id when write_scope_mode_is_scene_index_maintenance
    - unrelated_official_source_nodes_unchanged
    failure_status: persistent_write_scope_violation
    failure_policy:
    - hard_stop
    - do_not_deliver
    - do_not_retry_with_redraw
  component_draft_policy:
    target_page_id_ref: global_defaults.output_page_id
    formal_component_pages_writable: explicit_formal_component_maintenance_only
    source_component_authority: registered_component_pages_only
    default_output_kind: frame_structure_proposal
    real_component_nodes_allowed_only_when:
    - user explicitly requests componentization component variant or reusable component construction
    - component_or_variant_design route is high confidence
    real_component_node_requirements:
    - nest inside the current task Frame under the task_date divider
    - name with Draft prefix
    - call setSharedPluginData with namespace shaonian_bowen_design key authority value output_only
    - never publish from the output Page
    - never use as component style or source authority in later lookup
    formal_promotion_policy:
      intent_required: explicit_formal_component_maintenance
      required_records:
      - authorized_formal_page_ids
      - authorized_source_frame_ids
      - nearest_component_family
      - component_name_and_category
      - property_and_slot_contract
      - resizing_test
      - source_instance_replacement_scope
      - before_after_screenshot_check
      - metadata_updates
      allowed_actions:
      - create_or_extend_component_on_authorized_formal_page
      - replace_authorized_source_frame_local_module_with_promoted_instance
      - create_output_page_audit_preview
      authority_after_validation: formal_source
      publish_status: manual_only
    forbidden:
    - mutate_formal_source_component_or_component_set_without_explicit_maintenance_intent
    - mutate_unrelated_nodes_on_authorized_formal_page
    - create_real_component_for_non_component_task
    - publish_component_automatically
    - resolve_output_page_component_as_ready_to_force_source
    - create_parallel_family_without_nearest_family_check
  context_integrity_gate:
    purpose: preserve real source context for any write inside an existing page module component or state
    applies_to:
    - existing_context_local_mutation
    - local_interaction_modification
    - local_state_change_on_existing_context
    - multi_option_exploration_inside_existing_context
    - continuation_iteration_inside_existing_context
    required_before_write:
    - context_basis
    - target_region
    - locked_context
    - new_local_element_scope
    allowed_context_basis:
    - locked_source_screenshot
    - previous_output_screenshot
    - component_family_canvas
    - direct_native_output
    context_basis_rules:
      locked_source_screenshot: draft-only visual context allowed under context_strategy=screenshot_overlay
        or source_locked_visual_draft
      previous_output_screenshot: draft-only continuation context; lock it as background unless the previous
        output itself is a valid source-preserving frame
      component_family_canvas: only for component or variant tasks, not for reconstructing a full page
      direct_native_output: fully editable output built directly from verified components variables Auto Layout
        and the MCP default text engine
    local_one_off_overlay_scope:
      allowed:
      - new local widget control hint badge popover toast overlay or state marker requested in the current
        turn
      - local visual exploration for a not-yet-reusable element before productionization
      forbidden:
      - existing page skeleton
      - page background
      - status bar
      - navigation or header
      - existing list or feed content
      - existing card or cell family
      - bottom bar or tab bar
      - existing copy outside target_region
