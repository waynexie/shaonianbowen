    main_task: find_existing_page_component_material_or_state
    design_intent: return existing Figma source or output candidates without creating a new design
    visual_cache_refresh:
      semantic_intent: refresh_visual_cache
      allowed_when:
      - user explicitly requests refresh
      - a registered source-change maintenance event is being executed
      figma_write_allowed: false
      skill_cache_write_allowed: true_after_validation
      decision_owner: design_skill
      execution_owner: agent_using_available_tools
      eligibility_evidence:
      - concrete_source_node
      - live_node_and_render_state_verified
      - new_visual_checked
      - metadata_and_asset_pair_valid
      required_outcome: atomic_asset_and_metadata_replacement
      failure_behavior:
      - keep_previous_asset
      - mark_cache_stale
      - report_cache_refresh_failed
    variable_mode_visual_lookup:
      applies_to:
      - page_screen
      - component
      - component_variant
      - overlay
      - sheet
      - modal
      - local_state
      - source_frame
      use_when:
      - user asks how any existing target looks without explicitly choosing a visual mode; requested mode is
        light_default
      - user asks how any existing target looks in 夜间模式 暗色模式 深色模式 dark mode or equivalent wording
      semantic_intent: lookup_existing_visual_under_variable_mode
      precedence: higher_than_parent_existing_state_fallback
      rule: 'Treat every visual lookup as rendering the same resolved target node under requested_appearance_mode.
        An unspecified mode is always light_default; explicit night/dark wording selects dark. A missing standalone
        mode-specific frame is not evidence of absence.

        '
      preferred_collection:
        name: Color Token 语义色
        mode: requested_appearance_mode
      required_evidence:
      - concrete exportable screen_frame or component target
      - exact source_node_id and render_state cache decision
      - requested_appearance_mode and actual_rendered_appearance_mode exact-match decision
      - variable collection and requested mode applicability when live rendering is required
      - rendered visual or explicit unavailable status
      - source chrome component integrity
      - zero persistent lookup mutation
      - validated durable visual attachment embedded in the final response
      execution_constraints:
      - exact active unexpired same-node same-mode cache completes the lookup without another render
      - cache absence expiry node mismatch or mode mismatch requires live Figma rendering
      - live rendering inspects the requested variable collection applies the requested mode to the same resolved
        target captures the screenshot and restores the original mode
      - Agent uses its available Figma or rendering tools for capture and cleanup
      - Agent persists validates and embeds the captured image according to global_defaults.visual_query_delivery
      - any temporary variable-mode operation must be fully restored or removed
      completion_paths:
        exact_cache: deliver_after_same_node_same_mode_and_freshness_validation
        live_render: deliver_after_variable_mode_application_actual_mode_verification_persistence_and_cleanup
        live_tool_failure: return_exact_variable_mode_fallback_status
      parent_fallback_behavior: excluded
      generation_invitation_behavior: excluded
      fallback_status:
      - variable_mode_not_available when no matching dark mode exists
      - variable_mode_not_applicable when the target has no relevant variable bindings or cannot inherit the
        mode
      - variable_mode_preview_unavailable when the mode exists but the tool cannot render it without persistent
        Figma output
      - mcp_unavailable_degraded when live Figma cannot render the mode
      - requested_appearance_unavailable when no verified live rendering or exact same-node same-mode cache
        can be delivered
      forbidden:
      - use a light or mismatched state cache to answer a dark-mode lookup
      - use a dark or unknown-mode live screenshot to answer an unspecified light_default lookup
      - deliver any screenshot before actual_rendered_appearance_mode is verified
      - report not_found_in_source only because no separate dark-mode frame exists
      - generate or redesign a dark state without explicit generation wording
      - leave source nodes with changed explicit variable modes after lookup
      - create persistent Render dark preview or local preview frames in any Figma file for a lookup request
      - hand redraw status bar navigation bar back icon or icon button while answering a lookup
    source_options:
      source_screen: source-index.md and source-frames.yaml
      component_or_asset: components.yaml source-registry.yaml and relevant component pages
      ordinary_visual_preview: exact active unexpired visual-cache entry with freshness calculated from captured_at
        plus max_age_days
      freshness_or_state_sensitive: live canonical Figma source
      generated_work: fixed generated-output page only when explicitly requested
      historical_fallback: stale visual cache with timestamped evidence only
    source_selection_rule: choose the smallest matching branch and reuse current-turn evidence
    required_evidence:
    - resolved_target_or_not_found_in_source
    - evidence_status
    - whether_generation_was_explicitly_requested
    - visual_query_delivery_evidence_when_user_asks_to_see_the_result
    forbidden:
    - persistent_write_figma
    - create_new_frame
    - leave_render_or_preview_frame
    - generate_new_state
    - mutate_source_or_output_file
    - present_local_preview_as_existing_source
    fallback_policy: ordinary lookup outside variable_mode_visual_lookup reports not_found_in_source when no
      existing source state is found; variable_mode_visual_lookup uses its own fallback_status and completes
      without a generation invitation
    validation_gates:
