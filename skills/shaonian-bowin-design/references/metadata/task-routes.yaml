        - full_design_system_gate
        - component_instance_or_variant_audit
        - token_and_style_binding_check
        - full_frame_and_zoom_screenshot_validation
    smart_two_stage_delivery:
      enabled: true
      stage_1:
        result: first_visible_direction
        default_for: design or generation requests without selected direction or explicit production language
        tier: fast_visual_exploration
        required_label: exploration_draft
        quality_tier: inspiration_draft
        acceptance: a full-frame screenshot clearly communicates the requested direction while context integrity
          universal basic visual QA and registered_component_family_gate pass; token Auto Layout dark-mode
          and unregistered new componentization gaps are recorded as production_gaps
      stage_2:
        result: production_ready_output
        enter_when:
        - user selects a direction
