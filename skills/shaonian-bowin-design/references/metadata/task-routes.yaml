    - target_region
    - locked_context
    - new_local_element_scope
    - screenshot_check
    - basic_visual_gate
    - production_gaps
    - output_page_id
    - task_date
    - date_divider_id
    - date_divider_created_or_reused
    - top_level_canvas_collision_check
    - persistent_write_scope_check
    - experience_profile_loaded when page_experience_routing requires it
    - extension_heuristic_used when page_experience_routing requires it
    - component_resolution_evidence
    forbidden:
    - rerun_full_preflight_when_delta_only_changes_existing_output
    - requery_source_or_component_catalog_without_new_dependency
    - recreate_prior_options_from_scratch
    component_resolution_policy_ref: global_defaults.scene_index_first_policy
  local_mutation_profile:
