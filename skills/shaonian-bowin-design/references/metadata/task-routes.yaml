  figma_mcp_known_facts:
    local_component_resolution: treat indexed node_id as a locator, verify its live type, and resolve a concrete
      local COMPONENT or variant child inside the same Figma file; catalog Frames are never instance sources
      and no non-local fallback exists
    plugin_fetch: use_figma plugin runtime may not provide fetch; download and upload image assets outside
      the plugin, then reuse the uploaded node or image fill
    task_scoped_atomic_output: source frames and the fixed output page share one file; keep source frames readonly
      and create each task result inside a task_id-scoped output container in one use_figma write call
    text_runtime_policy_ref: references/metadata/tokens.yaml#typography.runtime_text_policy
  task_route_layer:
    priority_order:
    - existing_source_or_state_lookup
    - existing_context_local_mutation
    - component_or_variant_design
    - new_context_exploration
    matching_method: semantic_first_keyword_second
    existing_source_or_state_lookup_rule: resolve local scene/runtime index first; read only matched authority
      sections; live source/master reads are conditional on visual freshness, explicit latest request, write
      use or missing/stale/ambiguous index; generated-output page only for explicit output lookup
    existing_context_local_mutation_rule: lock the closest complete source screenshot inside a task-scoped
      output Frame; rebuild only target_region and preserve all non-target regions pixel-for-pixel
    component_or_variant_design_rule: extend nearest component family; structure and slot changes are allowed
      only inside the component family
    new_context_exploration_rule: create new screen or flow; reuse tokens components navigation and Shaonian
      Bowen design language
  canonical_reference_policy:
    project_file_authority: global_defaults.source_figma_file_key
    output_page_authority: global_defaults.output_page_id
    node_owners:
      source_group_and_pattern: references/metadata/source-registry.yaml
      exportable_screen_frame: references/metadata/source-frames.yaml
      component_or_component_set: references/metadata/components.yaml
      visual_cache_entry: references/metadata/visual-cache.yaml
    route_reference_format:
    - source_frames.use_for=<semantic_key>
    - source_registry.use_for=<semantic_key>
    - components.<component_name>
    narrative_reference_rule: md files use semantic refs or component names; concrete node IDs stay in canonical
      metadata and source-index.md only
    stale_reference_rule: stale or missing IDs may appear only in canonical stale lists, cache history, or
      source-index.md; never in active route source refs
    live_health_rule: resolve logical refs to concrete nodes, then verify live type, role, name/context and
      status before write
